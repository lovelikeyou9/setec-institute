<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KK Shop | Home</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="static/style/main.css">

</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">KK Shop</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Cart</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Hero -->
<section class="hero">
  <div>
    <h1>Upgrade Your Style</h1>
    <p class="lead">Discover the best deals today</p>
    <a href="#" class="btn btn-warning btn-lg mt-3">Shop Now</a>
  </div>
</section>

<!-- Products -->
<div class="container my-5">
  <h2 class="text-center section-title">Featured Products</h2>

  <div class="row g-4">

    <!-- Product -->
    <div class="col-md-3">
      <div class="card product-card">
        <img src="static/image/1.jpg">
        <div class="card-body text-center">
          <h6>Product 1</h6>
          <p class="price">$20</p>
          <button class="btn btn-outline-dark btn-sm btn-cart w-100">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card product-card">
        <img src="static/image/2.jpg">
        <div class="card-body text-center">
          <h6>Product 2</h6>
          <p class="price">$35</p>
          <button class="btn btn-outline-dark btn-sm btn-cart w-100">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card product-card">
        <img src="static/image/3.jpg">
        <div class="card-body text-center">
          <h6>Product 3</h6>
          <p class="price">$50</p>
          <button class="btn btn-outline-dark btn-sm btn-cart w-100">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card product-card">
        <img src="static/image/4.jpg">
        <div class="card-body text-center">
          <h6>Product 4</h6>
          <p class="price">$15</p>
          <button class="btn btn-outline-dark btn-sm btn-cart w-100">Add to Cart</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-4">
  <p class="mb-1">© 2026 KK Shop</p>
  <small>Designed with Bootstrap 5</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
