<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${username} + ' | User Profile'">User Profile</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { background: #eef2f7; }
        .nav-links { background: #2c3e50; padding: 10px 0; margin-bottom: 30px; }
        .nav-links a { color: #ecf0f1; margin: 0 15px; text-decoration: none; }
        .nav-links a:hover { color: #3498db; }
        .profile-card { max-width: 700px; margin: 0 auto 40px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
        .profile-header { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 40px; text-align: center; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.2); display: inline-flex; align-items: center; justify-content: center; font-size: 2.5em; margin-bottom: 16px; border: 3px solid #fff; }
        .profile-body { padding: 30px 40px; }
        .info-row { display: flex; padding: 14px 0; border-bottom: 1px solid #eee; }
        .info-row:last-child { border-bottom: none; }
        .info-label { width: 140px; font-weight: 600; color: #7f8c8d; }
        .info-value { flex: 1; color: #2c3e50; }
        .status-badge { display: inline-block; background: #2ecc71; color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 0.85em; }
    </style>
</head>
<body>
    <nav class="nav-links text-center">
        <a href="/">CV</a>
        <a href="/user">Home</a>
        <a href="/myUser">My User</a>
        <a href="/myAdmin">Admin Dashboard</a>
    </nav>

    <div class="profile-card">
        <div class="profile-header">
            <div class="avatar"><i class="fa fa-user"></i></div>
            <h2 th:text="${username}">John Doe</h2>
            <p th:text="${role}">Developer</p>
            <span class="status-badge"><i class="fa fa-circle"></i> Active</span>
        </div>
        <div class="profile-body">
            <div class="info-row">
                <div class="info-label"><i class="fa fa-envelope"></i> Email</div>
                <div class="info-value" th:text="${email}">john.doe@example.com</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fa fa-briefcase"></i> Role</div>
                <div class="info-value" th:text="${role}">Developer</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fa fa-calendar"></i> Joined</div>
                <div class="info-value" th:text="${joinDate}">January 2024</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fa fa-info-circle"></i> Bio</div>
                <div class="info-value" th:text="${bio}">Bio text here</div>
            </div>
        </div>
    </div>

    <script src="/js/jquery.js"></script>
    <script src="/js/bootstrap.min.js"></script>
</body>
</html>
