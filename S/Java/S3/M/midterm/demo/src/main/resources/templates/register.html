<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | eCommax</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <a class="logo" th:href="@{/}" style="margin-bottom:16px"><span class="logo-icon">🛍</span> eCommax</a>
    <h1>Create account</h1>
    <p class="hint">Register as a User to shop and checkout</p>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="userName" required placeholder="Choose a username" minlength="3">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="Create a password" minlength="4">
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirmPassword" required placeholder="Confirm password" minlength="4">
        </div>
        <button class="btn-primary" type="submit">Create Account</button>
    </form>

    <p class="auth-switch">
        Already have an account?
        <a th:href="@{/login}">Sign in</a>
    </p>
</div>
</body>
</html>
