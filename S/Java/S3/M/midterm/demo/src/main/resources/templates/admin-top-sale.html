<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Sale Category | eCommax</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="dash-body">
<div class="dash-shell">
    <div th:replace="~{fragments/dash :: sidebar('top-sale', ${staff})}"></div>
    <div class="dash-main">
        <div th:replace="~{fragments/dash :: top(${staff}, 'Top Sale Category')}"></div>
        <div class="dash-content">
            <div class="dash-panel" th:if="${topCatName != null}" style="margin-bottom:14px">
                <div class="dash-panel-pad">
                    <h3>Winner</h3>
                    <p style="font-size:22px;margin-top:8px">
                        <strong th:text="${topCatName}">Category</strong>
                        — <span th:text="${topSold}">0</span> items sold
                    </p>
                </div>
            </div>
            <div class="dash-panel">
                <div class="dash-panel-pad">
                    <h3>Sales by category</h3>
                    <div class="table-wrap">
                        <table>
                            <thead>
                            <tr><th>Category</th><th>Total Sold</th></tr>
                            </thead>
                            <tbody>
                            <tr th:each="entry : ${soldByCat}">
                                <td th:text="${catNames[entry.key]}">Cat</td>
                                <td th:text="${entry.value}">0</td>
                            </tr>
                            <tr th:if="${#maps.isEmpty(soldByCat)}">
                                <td colspan="2">No sales data yet.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
