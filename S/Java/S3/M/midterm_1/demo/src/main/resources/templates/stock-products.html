<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Product | eCommax</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="dash-body">
<div class="dash-shell">
    <div th:replace="~{fragments/dash :: sidebar('stock-products', ${staff})}"></div>
    <div class="dash-main">
        <div th:replace="~{fragments/dash :: top(${staff}, 'CRUD Product')}"></div>
        <div class="dash-content">
            <div class="dash-grid-2">
                <div class="dash-panel">
                    <div class="dash-panel-pad">
                        <h3 th:text="${formProduct.PId != null} ? 'Edit Product' : 'Add Product'">Add Product</h3>
                        <form th:action="@{/stock/products/save}" method="post">
                            <input type="hidden" name="PId" th:value="${formProduct.PId}">
                            <div class="form-group">
                                <label>Product Name</label>
                                <input type="text" name="PName" th:value="${formProduct.PName}" required>
                            </div>
                            <div class="form-group">
                                <label>Stock Qty</label>
                                <input type="number" name="SQty" th:value="${formProduct.SQty}" min="0" required>
                            </div>
                            <div class="form-group">
                                <label>Price</label>
                                <input type="number" step="0.01" name="Price" th:value="${formProduct.price}" min="0" required>
                            </div>
                            <div class="form-group">
                                <label>Expired Date</label>
                                <input type="date" name="ExpiredDate" th:value="${formProduct.expiredDate}" required>
                            </div>
                            <div class="form-group">
                                <label>Category</label>
                                <select name="CatID" required>
                                    <option value="">-- Select --</option>
                                    <option th:each="c : ${categories}"
                                            th:value="${c.catID}"
                                            th:text="${c.catName}"
                                            th:selected="${formProduct.catID != null and formProduct.catID == c.catID}"></option>
                                </select>
                            </div>
                            <button class="btn-primary" type="submit">Save Product</button>
                        </form>
                    </div>
                </div>
                <div class="dash-panel">
                    <div class="dash-panel-pad">
                        <h3>Product list</h3>
                        <div class="table-wrap">
                            <table>
                                <thead>
                                <tr>
                                    <th>PID</th><th>Name</th><th>Qty</th><th>Price</th>
                                    <th>Expired</th><th>Category</th><th>Sold</th><th>Actions</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="p : ${products}">
                                    <td th:text="${p.PId}"></td>
                                    <td th:text="${p.PName}"></td>
                                    <td th:text="${p.SQty}"></td>
                                    <td th:text="'$' + ${#numbers.formatDecimal(p.price, 1, 2)}"></td>
                                    <td th:text="${p.expiredDate}"></td>
                                    <td th:text="${catNames[p.catID]}"></td>
                                    <td th:text="${p.soldQty}"></td>
                                    <td class="actions">
                                        <a class="btn-edit" th:href="@{/stock/products/edit/{id}(id=${p.PId})}">Edit</a>
                                        <a class="btn-del" th:href="@{/stock/products/delete/{id}(id=${p.PId})}"
                                           onclick="return confirm('Delete this product?')">Delete</a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
