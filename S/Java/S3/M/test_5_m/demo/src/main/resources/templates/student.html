<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student MVC Demo</title>
</head>
<body>

<h1>Spring Boot MVC Example</h1>
<h2>Student List</h2>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Major</th>
            <th>Sex</th>
            <th>Score</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.name}"></td>
            <td th:text="${student.major}"></td>
            <td th:text="${student.sex}"></td>
            <td th:text="${student.score}"></td>
        </tr>
    </tbody>
</table>

<hr>

<h3>MVC Flow</h3>
<p>
    Browser → StudentController → ArrayList&lt;Student&gt;
    → Thymeleaf View → Browser
</p>

</body>
</html>
