<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }
        .box {
            width: min(480px, 92vw);
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }
        a {
            display: inline-block;
            margin: 0.4rem;
            padding: 0.55rem 0.9rem;
            background: #0ea5e9;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="box">
    <h1>Home</h1>
    <p th:if="${username != null}">Hello, <strong th:text="${username}">user</strong></p>
    <p th:if="${username == null}">Please login to continue.</p>
    <a th:href="@{/login}">Login</a>
</div>
</body>
</html>
