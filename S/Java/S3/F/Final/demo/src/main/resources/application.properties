spring.application.name=MME

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/comupter_store_final_java_iii?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
REMOVED

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# Server
server.port=8080

# App
app.upload.dir=uploads
app.commission.default=3.0
# Escrow: hold buyer funds until delivery + protection window, then pay seller
app.buyer-protection.days=3
app.escrow.release-interval-ms=900000

# JWT (API auth) — keep secret long (256+ bits) in real projects
app.jwt.secret=MMEJwtSecretKeyForSchoolDemoMustBeLongEnough256Bits!!
app.jwt.expiration-ms=86400000
