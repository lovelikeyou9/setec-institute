<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle}">Categories — Seller</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="main-content dash-shell">
  <div class="dash-layout">
    <aside th:replace="~{fragments/seller-sidebar :: sellerSidebar}"></aside>
    <div class="dash-main">
      <h1 style="font-size:1.4rem;margin-bottom:1rem">Categories</h1>
      <p class="section-sub" style="margin-top:-.5rem">Browse categories and open your products in each one</p>

      <form class="dash-search" th:action="@{/seller-dashboard/categories}" method="get">
        <input type="search" name="q" th:value="${q}" placeholder="Search categories..."/>
        <label class="dash-sort">
          <span>Sort</span>
          <select name="sort" onchange="this.form.submit()">
            <option value="sort" th:selected="${sort == null or sort == 'sort'}">Default order</option>
            <option value="name_asc" th:selected="${sort == 'name_asc'}">Name A–Z</option>
            <option value="name_desc" th:selected="${sort == 'name_desc'}">Name Z–A</option>
            <option value="products" th:selected="${sort == 'products'}">Most products</option>
          </select>
        </label>
        <button type="submit" class="btn btn-primary btn-sm">Search</button>
        <a th:if="${q != null and !#strings.isEmpty(q)}" th:href="@{/seller-dashboard/categories}" class="btn btn-outline btn-sm">Clear</a>
      </form>

      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Icon</th><th>Name</th><th>Slug</th><th>My Products</th><th></th></tr>
          </thead>
          <tbody>
            <tr th:each="c : ${categories}">
              <td th:text="${c.icon}">💻</td>
              <td th:text="${c.name}">CPU</td>
              <td th:text="${c.slug}">cpu</td>
              <td th:text="${counts[c.id] != null ? counts[c.id] : 0}">0</td>
              <td>
                <a class="btn btn-outline btn-sm"
                   th:href="@{/seller-dashboard/products(category=${c.id})}">View products</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<nav th:replace="~{fragments/mobile-nav :: mobileNav}"></nav>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
