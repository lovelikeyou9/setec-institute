<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle}">Addresses — MME</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="main-content dash-shell">
  <div class="dash-layout">
    <aside th:replace="~{fragments/dash-sidebar :: sidebar}"></aside>
    <div class="dash-main">
      <div class="section-head" style="margin-bottom:1rem">
        <h1 style="font-size:1.4rem">My Addresses</h1>
        <button type="button" class="btn btn-primary" data-modal-open="modalAddAddress">+ Add Address</button>
      </div>

      <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
      <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

      <div th:if="${#lists.isEmpty(addresses)}" class="empty-state" style="padding:2rem">
        <div class="icon">📍</div>
        <h3>No saved addresses</h3>
        <p>Add a delivery address for faster checkout.</p>
        <button type="button" class="btn btn-primary" style="margin-top:1rem" data-modal-open="modalAddAddress">Add Address</button>
      </div>

      <div class="form-card" th:each="addr : ${addresses}">
        <div style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start">
          <div>
            <strong th:text="${addr.fullName}">Name</strong>
            <span class="status-pill green" th:if="${addr.defaultAddress}" style="margin-left:.5rem">Default</span>
            <p style="margin-top:.35rem;color:var(--text-secondary)" th:text="${addr.phone}">Phone</p>
            <p style="color:var(--text-secondary)" th:text="${addr.fullAddress}">Address</p>
          </div>
          <div class="table-actions">
            <button type="button" class="btn btn-outline btn-sm"
                    data-edit="editAddressForm"
                    data-modal-open="modalEditAddress"
                    th:attr="data-action=@{/account/addresses/{id}/edit(id=${addr.id})},
                             data-field-fullName=${addr.fullName},
                             data-field-phone=${addr.phone},
                             data-field-country=${addr.country},
                             data-field-province=${addr.province},
                             data-field-district=${addr.district},
                             data-field-commune=${addr.commune},
                             data-field-street=${addr.street}">Edit</button>
            <button type="button" class="btn btn-danger btn-sm"
                    th:attr="data-delete=@{/account/addresses/{id}/delete(id=${addr.id})}, data-label=${'address for ' + addr.fullName}">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="modal-backdrop" id="modalAddAddress">
  <div class="modal modal-lg">
    <div class="modal-header"><h3>Add Address</h3><button type="button" class="modal-close" data-modal-close>×</button></div>
    <form th:action="@{/account/addresses}" method="post">
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group"><label>Full Name *</label><input type="text" name="fullName" required/></div>
          <div class="form-group"><label>Phone *</label><input type="tel" name="phone" required/></div>
          <div class="form-group">
            <label>Country *</label>
            <select name="country" required>
              <option value="">Select country</option>
              <option th:each="c : ${countryOptions}" th:value="${c}" th:text="${c}"></option>
            </select>
          </div>
          <div class="form-group"><label>Province / State *</label><input type="text" name="province" required placeholder="e.g. Phnom Penh"/></div>
          <div class="form-group"><label>District / City *</label><input type="text" name="district" required/></div>
          <div class="form-group"><label>Commune / Sangkat</label><input type="text" name="commune"/></div>
          <div class="form-group"><label>Street Address *</label><input type="text" name="street" required/></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save Address</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="modalEditAddress">
  <div class="modal modal-lg">
    <div class="modal-header"><h3>Edit Address</h3><button type="button" class="modal-close" data-modal-close>×</button></div>
    <form id="editAddressForm" method="post" action="#">
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group"><label>Full Name *</label><input type="text" name="fullName" required/></div>
          <div class="form-group"><label>Phone *</label><input type="tel" name="phone" required/></div>
          <div class="form-group">
            <label>Country *</label>
            <select name="country" required>
              <option value="">Select country</option>
              <option th:each="c : ${countryOptions}" th:value="${c}" th:text="${c}"></option>
            </select>
          </div>
          <div class="form-group"><label>Province / State *</label><input type="text" name="province" required/></div>
          <div class="form-group"><label>District / City *</label><input type="text" name="district" required/></div>
          <div class="form-group"><label>Commune / Sangkat</label><input type="text" name="commune"/></div>
          <div class="form-group"><label>Street Address *</label><input type="text" name="street" required/></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="modalDelete">
  <div class="modal">
    <div class="modal-header"><h3>Confirm Delete</h3><button type="button" class="modal-close" data-modal-close>×</button></div>
    <form id="deleteForm" method="post" action="#">
      <div class="modal-body"><p>Are you sure you want to delete <strong id="deleteLabel">this item</strong>?</p></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-danger">Delete</button>
      </div>
    </form>
  </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<nav th:replace="~{fragments/mobile-nav :: mobileNav}"></nav>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
