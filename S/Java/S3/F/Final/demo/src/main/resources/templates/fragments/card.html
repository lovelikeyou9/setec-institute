<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<article class="product-card" th:fragment="card">
  <div class="product-card-img">
    <a th:href="@{/product/{slug}(slug=${product.slug})}">
      <img th:src="${product.imageUrl}" th:alt="${product.name}" loading="lazy"/>
    </a>
    <div class="product-card-badges">
      <span class="badge badge-sale" th:if="${product.discountPercent != null and product.discountPercent > 0}"
            th:text="|${product.discountPercent}% OFF|">12% OFF</span>
    </div>
    <form th:action="@{/wishlist/toggle}" method="post" sec:authorize="isAuthenticated()">
      <input type="hidden" name="productId" th:value="${product.id}"/>
      <input type="hidden" name="redirect" th:value="${currentPath}"/>
      <button type="submit" class="fav-btn" title="Add to wishlist" aria-label="Wishlist">♡</button>
    </form>
  </div>
  <div class="product-card-body">
    <div class="product-card-brand" th:text="${product.brand.name}">ASUS</div>
    <a th:href="@{/product/{slug}(slug=${product.slug})}" class="product-card-name" th:text="${product.name}">Product</a>
    <div class="rating-row">
      <span th:replace="~{fragments/stars :: rating(${product.rating})}"></span>
      <span th:text="${product.rating}">4.8</span>
      <span th:text="|(${product.reviewCount})|">(0)</span>
    </div>
    <div class="price-row">
      <span class="price">$<th:block th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</th:block></span>
      <span class="price-old" th:if="${product.discountPercent != null and product.discountPercent > 0 and product.originalPrice != null}">
        $<th:block th:text="${#numbers.formatDecimal(product.originalPrice, 1, 2)}">0.00</th:block>
      </span>
    </div>
    <div class="product-card-meta">
      <span th:if="${product.soldCount >= 1000}" th:text="|Sold ${#numbers.formatDecimal(product.soldCount / 1000.0, 1, 1)}K|">Sold 1K</span>
      <span th:unless="${product.soldCount >= 1000}" th:text="|Sold ${product.soldCount}|">Sold 0</span>
    </div>
    <div class="product-card-seller">
      <span th:text="${product.seller.storeName}">Seller</span>
      <span class="verified-mark" th:if="${product.seller.verified}" title="Verified Seller">✓</span>
    </div>
    <div class="product-card-meta" th:text="${product.seller.location}">Phnom Penh</div>
    <div class="product-card-actions">
      <a th:href="@{/product/{slug}(slug=${product.slug})}" class="btn btn-outline btn-sm">View</a>
      <form th:action="@{/cart/add}" method="post" sec:authorize="isAuthenticated()" style="flex:1;min-width:0">
        <input type="hidden" name="productId" th:value="${product.id}"/>
        <input type="hidden" name="redirect" th:value="${currentPath}"/>
        <button type="submit" class="btn btn-accent btn-sm btn-block">Add to Cart</button>
      </form>
      <a th:href="@{/login}" class="btn btn-accent btn-sm" sec:authorize="!isAuthenticated()" style="flex:1;text-align:center">Add to Cart</a>
    </div>
  </div>
</article>
</body>
</html>
