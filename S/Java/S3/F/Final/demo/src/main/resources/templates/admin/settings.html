<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle}">Settings — Admin</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="main-content dash-shell">
  <div class="dash-layout">
    <aside th:replace="~{fragments/admin-sidebar :: adminSidebar}"></aside>
    <div class="dash-main">
      <h1 style="font-size:1.4rem;margin-bottom:1rem">Platform Settings</h1>

      <div class="form-card">
        <h3>MME Configuration</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>Platform Name</label>
            <input type="text" value="MME" readonly/>
          </div>
          <div class="form-group">
            <label>Default Commission</label>
            <input type="text" value="5%" readonly/>
          </div>
          <div class="form-group">
            <label>Currency</label>
            <input type="text" value="USD ($)" readonly/>
          </div>
          <div class="form-group">
            <label>Support Email</label>
            <input type="text" value="support@computerhub.com" readonly/>
          </div>
        </div>
        <p style="font-size:.85rem;color:var(--text-muted);margin-top:.75rem">
          Platform settings are currently managed via application configuration. Category and brand lists are controlled from their respective admin pages.
        </p>
      </div>

      <div class="form-card">
        <h3>Quick Actions</h3>
        <div style="display:flex;flex-wrap:wrap;gap:.5rem">
          <a th:href="@{/admin/seller-applications}" class="btn btn-outline btn-sm">Review Applications</a>
          <a th:href="@{/admin/categories}" class="btn btn-outline btn-sm">Manage Categories</a>
          <a th:href="@{/admin/brands}" class="btn btn-outline btn-sm">Manage Brands</a>
          <a th:href="@{/admin/commissions}" class="btn btn-outline btn-sm">View Commissions</a>
        </div>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<nav th:replace="~{fragments/mobile-nav :: mobileNav}"></nav>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
