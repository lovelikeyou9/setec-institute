<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle}">Categories — Admin</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="main-content dash-shell">
  <div class="dash-layout">
    <aside th:replace="~{fragments/admin-sidebar :: adminSidebar}"></aside>
    <div class="dash-main">
      <div class="section-head" style="margin-bottom:1rem">
        <h1 style="font-size:1.4rem">Categories</h1>
        <button type="button" class="btn btn-primary" data-modal-open="modalAddCategory">+ Add Category</button>
      </div>

      <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
      <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

      <form class="dash-search" th:action="@{/admin/categories}" method="get">
        <input type="search" name="q" th:value="${q}" placeholder="Search categories..."/>
        <label class="dash-sort">
          <span>Sort</span>
          <select name="sort" onchange="this.form.submit()">
            <option value="sort" th:selected="${sort == null or sort == 'sort'}">Sort order</option>
            <option value="name_asc" th:selected="${sort == 'name_asc'}">Name A–Z</option>
            <option value="name_desc" th:selected="${sort == 'name_desc'}">Name Z–A</option>
            <option value="newest" th:selected="${sort == 'newest'}">Newest</option>
          </select>
        </label>
        <button type="submit" class="btn btn-primary btn-sm">Search</button>
        <a th:if="${q != null and !#strings.isEmpty(q)}" th:href="@{/admin/categories}" class="btn btn-outline btn-sm">Clear</a>
      </form>

      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Icon</th><th>Name</th><th>Slug</th><th>Sort</th><th>Active</th><th>Actions</th></tr>
          </thead>
          <tbody>
            <tr th:each="c : ${categories}">
              <td th:text="${c.icon}">💻</td>
              <td th:text="${c.name}">CPU</td>
              <td th:text="${c.slug}">cpu</td>
              <td th:text="${c.sortOrder}">1</td>
              <td>
                <span class="status-pill" th:classappend="${c.active} ? 'green' : 'gray'"
                      th:text="${c.active ? 'Yes' : 'No'}">Yes</span>
              </td>
              <td class="table-actions">
                <button type="button" class="btn btn-outline btn-sm"
                        data-edit="editCategoryForm"
                        data-modal-open="modalEditCategory"
                        th:attr="data-action=@{/admin/categories/{id}/edit(id=${c.id})},
                                 data-field-name=${c.name},
                                 data-field-icon=${c.icon},
                                 data-field-active=${c.active}">Edit</button>
                <button type="button" class="btn btn-danger btn-sm"
                        th:attr="data-delete=@{/admin/categories/{id}/delete(id=${c.id})}, data-label=${'category ' + c.name}">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div class="modal-backdrop" id="modalAddCategory">
  <div class="modal">
    <div class="modal-header"><h3>Add Category</h3><button type="button" class="modal-close" data-modal-close>×</button></div>
    <form th:action="@{/admin/categories}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group"><label>Name *</label><input type="text" name="name" required placeholder="e.g. Cooling"/></div>
          <div class="form-group"><label>Icon *</label><input type="text" name="icon" required placeholder="❄️"/></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Add Category</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="modalEditCategory">
  <div class="modal">
    <div class="modal-header"><h3>Edit Category</h3><button type="button" class="modal-close" data-modal-close>×</button></div>
    <form id="editCategoryForm" method="post" action="#">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group"><label>Name *</label><input type="text" name="name" required/></div>
          <div class="form-group"><label>Icon *</label><input type="text" name="icon" required placeholder="❄️"/></div>
          <div class="form-group"><label><input type="checkbox" name="active" value="true"/> Active</label></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="modalDelete">
  <div class="modal">
    <div class="modal-header"><h3>Confirm Delete</h3><button type="button" class="modal-close" data-modal-close>×</button></div>
    <form id="deleteForm" method="post" action="#">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="modal-body"><p>Are you sure you want to delete <strong id="deleteLabel">this item</strong>?</p></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-danger">Delete</button>
      </div>
    </form>
  </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<nav th:replace="~{fragments/mobile-nav :: mobileNav}"></nav>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
