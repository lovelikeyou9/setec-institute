<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle}">Brands — Admin</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="main-content dash-shell">
  <div class="dash-layout">
    <aside th:replace="~{fragments/admin-sidebar :: adminSidebar}"></aside>
    <div class="dash-main">
      <div class="section-head" style="margin-bottom:1rem">
        <h1 style="font-size:1.4rem">Brands</h1>
        <button type="button" class="btn btn-primary" data-modal-open="modalAddBrand">+ Add Brand</button>
      </div>

      <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
      <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

      <form class="dash-search" th:action="@{/admin/brands}" method="get">
        <input type="search" name="q" th:value="${q}" placeholder="Search brands..."/>
        <label class="dash-sort">
          <span>Sort</span>
          <select name="sort" onchange="this.form.submit()">
            <option value="name_asc" th:selected="${sort == null or sort == 'name_asc'}">Name A–Z</option>
            <option value="name_desc" th:selected="${sort == 'name_desc'}">Name Z–A</option>
            <option value="newest" th:selected="${sort == 'newest'}">Newest</option>
          </select>
        </label>
        <button type="submit" class="btn btn-primary btn-sm">Search</button>
        <a th:if="${q != null and !#strings.isEmpty(q)}" th:href="@{/admin/brands}" class="btn btn-outline btn-sm">Clear</a>
      </form>

      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Logo</th><th>ID</th><th>Name</th><th>Slug</th><th>Active</th><th>Actions</th></tr>
          </thead>
          <tbody>
            <tr th:each="b : ${brands}">
              <td>
                <img class="table-thumb table-thumb-logo" th:if="${b.logoUrl != null and !#strings.isEmpty(b.logoUrl)}"
                     th:src="${b.logoUrl}" th:alt="${b.name}"/>
                <span th:unless="${b.logoUrl != null and !#strings.isEmpty(b.logoUrl)}" class="table-thumb-empty">—</span>
              </td>
              <td th:text="${b.id}">1</td>
              <td th:text="${b.name}">ASUS</td>
              <td th:text="${b.slug}">asus</td>
              <td>
                <span class="status-pill" th:classappend="${b.active} ? 'green' : 'gray'"
                      th:text="${b.active ? 'Yes' : 'No'}">Yes</span>
              </td>
              <td class="table-actions">
                <button type="button" class="btn btn-outline btn-sm"
                        data-edit="editBrandForm"
                        data-modal-open="modalEditBrand"
                        th:attr="data-action=@{/admin/brands/{id}/edit(id=${b.id})},
                                 data-field-name=${b.name},
                                 data-field-logoUrl=${b.logoUrl},
                                 data-field-active=${b.active}">Edit</button>
                <button type="button" class="btn btn-danger btn-sm"
                        th:attr="data-delete=@{/admin/brands/{id}/delete(id=${b.id})}, data-label=${'brand ' + b.name}">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div class="modal-backdrop" id="modalAddBrand">
  <div class="modal">
    <div class="modal-header"><h3>Add Brand</h3><button type="button" class="modal-close" data-modal-close>×</button></div>
    <form th:action="@{/admin/brands}" method="post" enctype="multipart/form-data" id="addBrandForm">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group full"><label>Brand Name *</label><input type="text" name="name" required placeholder="e.g. Corsair"/></div>
          <div class="form-group full">
            <label>Brand Logo</label>
            <div class="logo-field" data-logo-field>
              <div class="logo-preview-box">
                <img class="logo-preview-img" alt="Logo preview" hidden/>
                <span class="logo-preview-empty">No image selected</span>
              </div>
              <div class="logo-field-controls">
                <input type="file" name="logoFile" accept="image/*" class="logo-file-input"/>
                <input type="text" name="logoUrl" class="logo-url-input" placeholder="Or paste logo URL /uploads/logo/..."/>
                <p class="logo-field-hint">Upload an image or paste a URL. Preview updates instantly.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Add Brand</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="modalEditBrand">
  <div class="modal">
    <div class="modal-header"><h3>Edit Brand</h3><button type="button" class="modal-close" data-modal-close>×</button></div>
    <form id="editBrandForm" method="post" action="#" enctype="multipart/form-data">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group full"><label>Brand Name *</label><input type="text" name="name" required/></div>
          <div class="form-group full">
            <label>Brand Logo</label>
            <div class="logo-field" data-logo-field>
              <div class="logo-preview-box">
                <img class="logo-preview-img" alt="Logo preview" hidden/>
                <span class="logo-preview-empty">No image</span>
              </div>
              <div class="logo-field-controls">
                <input type="file" name="logoFile" accept="image/*" class="logo-file-input"/>
                <input type="text" name="logoUrl" class="logo-url-input" placeholder="Logo URL"/>
                <p class="logo-field-hint">Current logo shows above. Upload a new file to replace it.</p>
              </div>
            </div>
          </div>
          <div class="form-group"><label><input type="checkbox" name="active" value="true"/> Active</label></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="modalDelete">
  <div class="modal">
    <div class="modal-header"><h3>Confirm Delete</h3><button type="button" class="modal-close" data-modal-close>×</button></div>
    <form id="deleteForm" method="post" action="#">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="modal-body"><p>Are you sure you want to delete <strong id="deleteLabel">this item</strong>?</p></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-danger">Delete</button>
      </div>
    </form>
  </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<nav th:replace="~{fragments/mobile-nav :: mobileNav}"></nav>
<script th:src="@{/js/main.js}"></script>
<script>
(function () {
  const bindLogoField = (root) => {
    const img = root.querySelector('.logo-preview-img');
    const empty = root.querySelector('.logo-preview-empty');
    const urlInput = root.querySelector('.logo-url-input');
    const fileInput = root.querySelector('.logo-file-input');
    if (!img || !empty) return;

    const show = (src) => {
      if (src && String(src).trim()) {
        img.src = src;
        img.hidden = false;
        empty.hidden = true;
      } else {
        img.removeAttribute('src');
        img.hidden = true;
        empty.hidden = false;
      }
    };

    root._setLogoPreview = show;

    if (urlInput) {
      urlInput.addEventListener('input', () => {
        if (fileInput) fileInput.value = '';
        show(urlInput.value.trim());
      });
    }
    if (fileInput) {
      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) {
          show(urlInput ? urlInput.value.trim() : '');
          return;
        }
        const reader = new FileReader();
        reader.onload = () => show(reader.result);
        reader.readAsDataURL(file);
      });
    }
  };

  document.querySelectorAll('[data-logo-field]').forEach(bindLogoField);

  // After edit form is filled by main.js, refresh logo preview
  document.querySelectorAll('[data-edit="editBrandForm"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      requestAnimationFrame(() => {
        const form = document.getElementById('editBrandForm');
        if (!form) return;
        const field = form.querySelector('[data-logo-field]');
        const urlInput = form.querySelector('.logo-url-input');
        const fileInput = form.querySelector('.logo-file-input');
        if (fileInput) fileInput.value = '';
        if (field && field._setLogoPreview) {
          field._setLogoPreview(urlInput ? urlInput.value.trim() : '');
        }
      });
    });
  });

  // Reset add modal preview when opened
  document.querySelectorAll('[data-modal-open="modalAddBrand"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const form = document.getElementById('addBrandForm');
      if (!form) return;
      form.reset();
      const field = form.querySelector('[data-logo-field]');
      if (field && field._setLogoPreview) field._setLogoPreview('');
    });
  });
})();
</script>
</body>
</html>
