<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle}">Cart — MME</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div th:if="${message}" class="container" style="padding-top:1rem"><div class="alert alert-success" th:text="${message}"></div></div>
<div th:if="${error}" class="container" style="padding-top:1rem"><div class="alert alert-error" th:text="${error}"></div></div>

<main class="main-content">
  <div class="container">
    <nav class="breadcrumb">
      <a th:href="@{/}">Home</a>
      <span class="sep">/</span>
      <span>Shopping Cart</span>
    </nav>
    <h1 class="section-title" style="margin-bottom:1rem">Shopping Cart</h1>

    <div th:if="${groupedCart == null or #maps.isEmpty(groupedCart)}" class="empty-state">
      <div class="icon">🛒</div>
      <h3>Your cart is empty</h3>
      <p>Add routers, cameras, consoles, components, or any tech gear to get started.</p>
      <a th:href="@{/products}" class="btn btn-primary" style="margin-top:1rem">Browse Products</a>
    </div>

    <div class="cart-layout" th:if="${groupedCart != null and !#maps.isEmpty(groupedCart)}">
      <div>
        <form th:action="@{/cart/select-all}" method="post" style="margin-bottom:.75rem">
          <input type="hidden" name="selected" value="true"/>
          <button type="submit" class="btn btn-outline btn-sm">Select All</button>
        </form>
        <form th:action="@{/cart/select-all}" method="post" style="display:inline;margin-left:.35rem">
          <input type="hidden" name="selected" value="false"/>
          <button type="submit" class="btn btn-outline btn-sm">Deselect All</button>
        </form>

        <div class="cart-seller-group" th:each="entry : ${groupedCart}">
          <div class="cart-seller-head">
            <span th:text="${entry.key.storeName}">Seller</span>
            <span class="badge badge-verified" th:if="${entry.key.verified}">✓</span>
          </div>

          <div class="cart-item" th:each="item : ${entry.value}">
            <form th:action="@{/cart/toggle}" method="post">
              <input type="hidden" name="itemId" th:value="${item.id}"/>
              <input type="checkbox" th:checked="${item.selected}" onchange="this.form.submit()"
                     th:title="'Select ' + ${item.product.name}"/>
            </form>
            <a th:href="@{/product/{slug}(slug=${item.product.slug})}">
              <img th:src="${item.product.imageUrl}" th:alt="${item.product.name}"/>
            </a>
            <div>
              <a th:href="@{/product/{slug}(slug=${item.product.slug})}"
                 th:text="${item.product.name}" style="font-weight:600">Product</a>
              <div class="price-row" style="margin-top:.35rem">
                <span class="price" th:text="${'$' + #numbers.formatDecimal(item.product.price, 1, 2)}">$0</span>
              </div>
              <form th:action="@{/cart/remove}" method="post" style="margin-top:.5rem">
                <input type="hidden" name="itemId" th:value="${item.id}"/>
                <button type="submit" class="btn btn-outline btn-sm">Remove</button>
              </form>
            </div>
            <div>
              <form th:action="@{/cart/update}" method="post" style="display:flex;align-items:center;gap:.35rem">
                <input type="hidden" name="itemId" th:value="${item.id}"/>
                <div class="qty-selector">
                  <button type="button" onclick="var i=this.parentElement.querySelector('input[name=quantity]');i.value=Math.max(1,+i.value-1);i.form.submit()">−</button>
                  <input type="number" name="quantity" th:value="${item.quantity}" min="1" onchange="this.form.submit()"/>
                  <button type="button" onclick="var i=this.parentElement.querySelector('input[name=quantity]');i.value=+i.value+1;i.form.submit()">+</button>
                </div>
              </form>
              <div style="text-align:right;margin-top:.5rem;font-weight:700;color:var(--accent)"
                   th:text="${'$' + #numbers.formatDecimal(item.product.price * item.quantity, 1, 2)}">$0</div>
            </div>
          </div>
        </div>
      </div>

      <aside class="cart-summary">
        <h3 style="margin-bottom:1rem">Order Summary</h3>
        <div class="summary-row">
          <span>Subtotal</span>
          <span th:text="${'$' + #numbers.formatDecimal(subtotal, 1, 2)}">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span>Calculated at checkout</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span th:text="${'$' + #numbers.formatDecimal(subtotal, 1, 2)}">$0.00</span>
        </div>
        <a th:href="@{/checkout}" class="btn btn-accent btn-block" style="width:100%;margin-top:1rem;text-align:center">Proceed to Checkout</a>
        <a th:href="@{/products}" class="btn btn-outline btn-block" style="width:100%;margin-top:.5rem;text-align:center">Continue Shopping</a>
      </aside>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<nav th:replace="~{fragments/mobile-nav :: mobileNav}"></nav>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
