<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle}">Users — Admin</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="main-content dash-shell">
  <div class="dash-layout">
    <aside th:replace="~{fragments/admin-sidebar :: adminSidebar}"></aside>
    <div class="dash-main">
      <div class="section-head" style="margin-bottom:1rem">
        <h1 style="font-size:1.4rem" th:text="${customersOnly} ? 'Customers Lists' : 'Users Lists'">Users Lists</h1>
        <button type="button" class="btn btn-primary" data-modal-open="modalAddUser"
                th:text="${customersOnly} ? '+ Add Customer' : '+ Add User'">+ Add User</button>
      </div>
      <p style="color:var(--text-muted);margin:-.5rem 0 1rem;font-size:.9rem">Click a user row to view purchase analytics.</p>

      <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
      <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

      <form class="dash-search" th:action="${customersOnly} ? @{/admin/customers} : @{/admin/users}" method="get">
        <input type="search" name="q" th:value="${q}" placeholder="Search name, email, phone..."/>
        <label class="dash-sort" th:if="${!customersOnly}">
          <span>Role</span>
          <select name="role" onchange="this.form.submit()">
            <option value="" th:selected="${roleFilter == null or roleFilter == ''}">All roles</option>
            <option value="CUSTOMER" th:selected="${roleFilter == 'CUSTOMER'}">Customer</option>
            <option value="SELLER" th:selected="${roleFilter == 'SELLER'}">Seller</option>
            <option value="ADMIN" th:selected="${roleFilter == 'ADMIN'}">Admin</option>
          </select>
        </label>
        <label class="dash-sort">
          <span>Sort</span>
          <select name="sort" onchange="this.form.submit()">
            <option value="newest" th:selected="${sort == null or sort == 'newest'}">Newest</option>
            <option value="oldest" th:selected="${sort == 'oldest'}">Oldest</option>
            <option value="name_asc" th:selected="${sort == 'name_asc'}">Name A–Z</option>
            <option value="name_desc" th:selected="${sort == 'name_desc'}">Name Z–A</option>
            <option value="email_asc" th:selected="${sort == 'email_asc'}">Email A–Z</option>
            <option value="email_desc" th:selected="${sort == 'email_desc'}">Email Z–A</option>
            <option value="role" th:selected="${sort == 'role'}" th:if="${!customersOnly}">Role</option>
          </select>
        </label>
        <button type="submit" class="btn btn-primary btn-sm">Search</button>
        <a th:if="${(q != null and !#strings.isEmpty(q)) or (roleFilter != null and !#strings.isEmpty(roleFilter) and !customersOnly) or (sort != null and sort != 'newest')}"
           th:href="${customersOnly} ? @{/admin/customers} : @{/admin/users}"
           class="btn btn-outline btn-sm">Clear</a>
      </form>

      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr>
          </thead>
          <tbody>
            <tr th:each="u : ${users}" class="profile-row-click" th:attr="data-href=@{/admin/users/{id}(id=${u.id})}">
              <td th:text="${u.id}">1</td>
              <td><a class="table-link-btn" th:href="@{/admin/users/{id}(id=${u.id})}" th:text="${u.fullName}">Name</a></td>
              <td th:text="${u.email}">email</td>
              <td th:text="${u.phone}">phone</td>
              <td><span class="status-pill blue" th:text="${u.role.name()}">CUSTOMER</span></td>
              <td>
                <span class="status-pill" th:classappend="${u.enabled} ? 'green' : 'red'"
                      th:text="${u.enabled ? 'Active' : 'Banned'}">Active</span>
              </td>
              <td th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'dd MMM yyyy') : '—'}">01 Jan</td>
              <td class="table-actions" onclick="event.stopPropagation()">
                <a th:if="${u.role.name() != 'ADMIN'}"
                   th:href="@{/profile/{id}(id=${u.id})}"
                   class="btn btn-outline btn-sm" target="_blank" rel="noopener">Profile</a>
                <button type="button" class="btn btn-outline btn-sm"
                        th:if="${u.role.name() != 'ADMIN'}"
                        data-edit="editUserForm"
                        data-modal-open="modalEditUser"
                        th:attr="data-action=@{/admin/users/{id}/edit(id=${u.id})},
                                 data-field-fullName=${u.fullName},
                                 data-field-email=${u.email},
                                 data-field-phone=${u.phone},
                                 data-field-role=${u.role.name()},
                                 data-field-enabled=${u.enabled}">Edit</button>
                <form th:if="${u.role.name() != 'ADMIN' and u.enabled}" th:action="@{/admin/users/{id}/ban(id=${u.id})}" method="post" style="display:inline">
                  <button type="submit" class="btn btn-sm btn-danger">Ban</button>
                </form>
                <form th:if="${u.role.name() != 'ADMIN' and !u.enabled}" th:action="@{/admin/users/{id}/unban(id=${u.id})}" method="post" style="display:inline">
                  <button type="submit" class="btn btn-sm btn-primary">Unban</button>
                </form>
                <button type="button" class="btn btn-danger btn-sm"
                        th:if="${u.role.name() != 'ADMIN'}"
                        th:attr="data-delete=@{/admin/users/{id}/delete(id=${u.id})}, data-label=${'user ' + u.fullName}">Delete</button>
                <span th:if="${u.role.name() == 'ADMIN'}" style="color:var(--text-muted);font-size:.8rem">Protected</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- Add User Modal -->
<div class="modal-backdrop" id="modalAddUser">
  <div class="modal">
    <div class="modal-header">
      <h3>Add User</h3>
      <button type="button" class="modal-close" data-modal-close>×</button>
    </div>
    <form th:action="@{/admin/users}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group"><label>Full Name *</label><input type="text" name="fullName" required/></div>
          <div class="form-group"><label>Email *</label><input type="email" name="email" required/></div>
          <div class="form-group"><label>Phone</label><input type="text" name="phone"/></div>
          <div class="form-group"><label>Password *</label><input type="password" name="password" required minlength="6"/></div>
          <div class="form-group">
            <label>Role *</label>
            <select name="role" required>
              <option value="CUSTOMER" th:selected="${customersOnly}">CUSTOMER</option>
              <option value="SELLER" th:unless="${customersOnly}">SELLER</option>
              <option value="ADMIN" th:unless="${customersOnly}">ADMIN</option>
            </select>
          </div>
          <div class="form-group"><label><input type="checkbox" name="enabled" value="true" checked/> Active</label></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-primary" th:text="${customersOnly} ? 'Add Customer' : 'Add User'">Add User</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit User Modal -->
<div class="modal-backdrop" id="modalEditUser">
  <div class="modal">
    <div class="modal-header">
      <h3>Edit User</h3>
      <button type="button" class="modal-close" data-modal-close>×</button>
    </div>
    <form id="editUserForm" method="post" action="#">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group"><label>Full Name *</label><input type="text" name="fullName" required/></div>
          <div class="form-group"><label>Email *</label><input type="email" name="email" required/></div>
          <div class="form-group"><label>Phone</label><input type="text" name="phone"/></div>
          <div class="form-group"><label>New Password</label><input type="password" name="password" placeholder="Leave blank to keep"/></div>
          <div class="form-group">
            <label>Role *</label>
            <select name="role" required>
              <option value="CUSTOMER">CUSTOMER</option>
              <option value="SELLER">SELLER</option>
              <option value="ADMIN">ADMIN</option>
            </select>
          </div>
          <div class="form-group"><label><input type="checkbox" name="enabled" value="true"/> Active</label></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal-backdrop" id="modalDelete">
  <div class="modal">
    <div class="modal-header">
      <h3>Confirm Delete</h3>
      <button type="button" class="modal-close" data-modal-close>×</button>
    </div>
    <form id="deleteForm" method="post" action="#">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="modal-body">
        <p>Are you sure you want to delete <strong id="deleteLabel">this item</strong>?</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-danger">Delete</button>
      </div>
    </form>
  </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<nav th:replace="~{fragments/mobile-nav :: mobileNav}"></nav>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
