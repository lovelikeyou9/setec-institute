<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle}">Seller Applications — Admin</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div th:if="${message}" class="container" style="padding-top:1rem"><div class="alert alert-success" th:text="${message}"></div></div>

<main class="main-content dash-shell">
  <div class="dash-layout">
    <aside th:replace="~{fragments/admin-sidebar :: adminSidebar}"></aside>
    <div class="dash-main">
      <h1 style="font-size:1.4rem;margin-bottom:1rem">Seller Applications</h1>

      <div th:if="${#lists.isEmpty(applications)}" class="empty-state">
        <div class="icon">📋</div>
        <h3>No pending applications</h3>
        <p>New seller applications will appear here for review.</p>
      </div>

      <div class="form-card" th:each="app : ${applications}">
        <div style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start">
          <div>
            <h3 th:text="${app.storeName}">Store</h3>
            <p style="color:var(--text-secondary);margin-top:.35rem">
              Owner: <strong th:text="${app.ownerName}">Name</strong> ·
              Phone: <span th:text="${app.phone}">012</span> ·
              Location: <span th:text="${app.location}">PP</span>
            </p>
            <p style="font-size:.9rem;margin-top:.35rem" th:text="${app.address}">Address</p>
            <p style="font-size:.9rem;color:var(--text-muted);margin-top:.35rem"
               th:if="${app.businessInfo != null}" th:text="${app.businessInfo}">Business info</p>
            <p style="font-size:.9rem;margin-top:.5rem" th:text="${app.description}">Description</p>
          </div>
          <div style="display:flex;flex-direction:column;gap:.5rem;min-width:220px">
            <form th:action="@{/admin/sellers/{id}/approve(id=${app.id})}" method="post">
              <button type="submit" class="btn btn-primary btn-block" style="width:100%">Approve</button>
            </form>
            <form th:action="@{/admin/sellers/{id}/reject(id=${app.id})}" method="post">
              <input type="text" name="reason" required placeholder="Rejection reason"
                     style="width:100%;padding:.5rem;margin-bottom:.35rem;border:1px solid var(--border);border-radius:6px"/>
              <button type="submit" class="btn btn-outline btn-block" style="width:100%">Reject</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<nav th:replace="~{fragments/mobile-nav :: mobileNav}"></nav>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
