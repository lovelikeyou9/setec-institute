<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle}">Edit Product — Admin</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="main-content dash-shell">
  <div class="dash-layout">
    <aside th:replace="~{fragments/admin-sidebar :: adminSidebar}"></aside>
    <div class="dash-main">
      <h1 style="font-size:1.4rem;margin-bottom:1rem">Edit Product</h1>
      <div class="form-card">
        <form th:action="@{/admin/products/{id}/edit(id=${product.id})}" method="post" enctype="multipart/form-data">
          <div class="form-grid">
            <div class="form-group full">
              <label for="name">Product Name *</label>
              <input type="text" id="name" name="name" required th:value="${product.name}"/>
            </div>
            <div class="form-group">
              <label for="categoryId">Category *</label>
              <select id="categoryId" name="categoryId" required>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                        th:selected="${c.id == product.category.id}">CPU</option>
              </select>
            </div>
            <div class="form-group">
              <label for="brandId">Brand *</label>
              <select id="brandId" name="brandId" required>
                <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"
                        th:selected="${b.id == product.brand.id}">ASUS</option>
              </select>
            </div>
            <div class="form-group">
              <label for="price">Price (USD) *</label>
              <input type="number" id="price" name="price" required min="0" step="0.01" th:value="${product.price}"/>
            </div>
            <div class="form-group">
              <label for="originalPrice">Original Price</label>
              <input type="number" id="originalPrice" name="originalPrice" min="0" step="0.01" th:value="${product.originalPrice}"/>
            </div>
            <div class="form-group">
              <label for="stock">Stock *</label>
              <input type="number" id="stock" name="stock" required min="0" th:value="${product.stock}"/>
            </div>
            <div class="form-group">
              <label for="sku">SKU</label>
              <input type="text" id="sku" name="sku" th:value="${product.sku}"/>
            </div>
            <div class="form-group">
              <label for="warranty">Warranty</label>
              <input type="text" id="warranty" name="warranty" th:value="${product.warranty}"/>
            </div>
            <div class="form-group full">
              <label for="imageFile">Product Image *</label>
              <input type="file" id="imageFile" name="imageFile" accept="image/*"
                     th:required="${product.imageUrl == null or #strings.isEmpty(product.imageUrl)}"/>
              <small style="color:var(--text-muted);font-size:.75rem;display:block;margin-top:.35rem">
                Choose an image file. Leave empty to keep the current image.
              </small>
              <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" alt="" class="table-thumb" style="margin-top:.5rem;width:80px;height:80px;object-fit:cover"/>
            </div>
            <div class="form-group full">
              <label for="description">Description *</label>
              <textarea id="description" name="description" rows="4" required th:text="${product.description}"></textarea>
            </div>
            <div class="form-group full">
              <label for="specifications">Specifications</label>
              <textarea id="specifications" name="specifications" rows="5" th:text="${product.specifications}"></textarea>
            </div>
            <div class="form-group">
              <label><input type="checkbox" name="active" value="true" th:checked="${product.active}"/> Active</label>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg" style="margin-top:.5rem">Save Changes</button>
          <a th:href="@{/admin/products}" class="btn btn-outline" style="margin-left:.5rem">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<nav th:replace="~{fragments/mobile-nav :: mobileNav}"></nav>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
