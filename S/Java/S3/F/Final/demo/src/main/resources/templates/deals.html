<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle}">Flash Deals — MME</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="main-content">
  <div class="container" style="padding-top:1.5rem">
    <nav class="breadcrumb">
      <a th:href="@{/}">Home</a>
      <span class="sep">/</span>
      <span>Flash Deals</span>
    </nav>

    <div class="deal-banner">
      <div>
        <h1>⚡ Flash Deals</h1>
        <p style="opacity:.8;font-size:.9rem;margin-top:.25rem">Limited-time deals across computers, networking, gaming, cameras &amp; more</p>
      </div>
      <div class="countdown" data-countdown="2026-12-31T23:59:59">
        <div class="countdown-unit"><strong data-h>00</strong><span>Hours</span></div>
        <div class="countdown-unit"><strong data-m>00</strong><span>Mins</span></div>
        <div class="countdown-unit"><strong data-s>00</strong><span>Secs</span></div>
      </div>
    </div>

    <div th:if="${flashDeals == null or #lists.isEmpty(flashDeals)}" class="empty-state">
      <div class="icon">🏷️</div>
      <h3>No flash deals right now</h3>
      <p>Check back soon — sellers drop limited-time offers throughout the week.</p>
      <a th:href="@{/products}" class="btn btn-primary" style="margin-top:1rem">Browse Products</a>
    </div>

    <div class="product-grid" th:if="${flashDeals != null and !#lists.isEmpty(flashDeals)}">
      <th:block th:each="product : ${flashDeals}">
        <div th:replace="~{fragments/card :: card}"></div>
      </th:block>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<nav th:replace="~{fragments/mobile-nav :: mobileNav}"></nav>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
