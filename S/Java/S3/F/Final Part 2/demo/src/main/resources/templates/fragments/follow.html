<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- Follow / Unfollow store button. Params: sellerId, following (bool), redirect (optional path) -->
<th:block th:fragment="btn(sellerId, following, redirect)">
  <form th:action="@{/seller/{id}/follow(id=${sellerId})}" method="post" style="display:inline"
        sec:authorize="isAuthenticated()">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="redirect" th:value="${redirect}"/>
    <button type="submit" class="btn btn-sm"
            th:classappend="${following} ? ' btn-outline' : ' btn-primary'"
            th:text="${following} ? 'Following' : 'Follow'">Follow</button>
  </form>
  <a th:href="@{/login}" class="btn btn-primary btn-sm" sec:authorize="!isAuthenticated()">Follow</a>
</th:block>
</body>
</html>
