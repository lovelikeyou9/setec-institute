<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Prescriptions</title>
    <style>
        /* SAME STYLE AS APPOINTMENTS.HTML */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            background: #f5f7fb;
            color: #1b2230;
        }

        .container {
            max-width: 1100px;
            margin: 32px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 6px;
        }

        .lead {
            margin: 0 0 18px 0;
            color: #5b6878;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 160px;
        }

        .control-item input,
        .control-item select {
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        #search-btn,
        .btn-add {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            background: #2563eb;
            transition: .2s;
        }

        #search-btn:hover,
        .btn-add:hover {
            background: #1d4ed8;
        }

        .appointments {
            display: grid;
            gap: 14px;
        }

        .appt-card {
            background: #fff;
            border: 1px solid #e6eef6;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            gap: 18px;
            align-items: flex-start;
            box-shadow: 0 6px 18px rgba(16, 24, 40, 0.04);
        }

        .appt-main {
            flex: 0 0 220px;
            min-width: 160px;
        }

        .appt-id {
            margin: 0 0 6px 0;
            font-size: 1.05rem;
        }

        .meta {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 6px 8px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            background: #eef2ff;
        }

        .appt-info {
            flex: 1;
            position: relative;
        }

        .row {
            display: flex;
            gap: 18px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        dt {
            font-size: 0.78rem;
            color: #475569;
            margin-bottom: 4px;
        }

        dd {
            margin: 0;
            font-weight: 600;
        }

        .notes dt {
            font-weight: 700;
        }

        .notes dd {
            font-weight: 400;
            color: #334155;
            margin-top: 6px;
        }

        .card-footer {
            margin-top: 12px;
            color: #64748b;
            font-size: 0.86rem;
        }

        .btn-edit,
        .btn-delete {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            margin-top: 12px;
            margin-right: 10px;
            color: white;
        }

        .btn-edit {
            background: #10b981;
        }

        .btn-edit:hover {
            background: #059669;
        }

        .btn-delete {
            background: #ef4444;
        }

        .btn-delete:hover {
            background: #b91c1c;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90%;
            overflow: auto;
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .modal-content label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
        }

        .modal-content input,
        .modal-content select,
        .modal-content textarea {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save {
            background: #2563eb;
            color: white;
        }

        .btn-cancel {
            background: #e5e7eb;
        }

        /* Delete Modal specific */
        #delete-modal .modal-content {
            text-align: center;
        }

        #delete-modal h2 {
            color: #ef4444;
            margin-bottom: 12px;
        }

        #delete-modal p {
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #475569;
        }

        #delete-modal .modal-buttons {
            justify-content: center;
        }

        .btn-delete-confirm {
            background: #ef4444;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-delete-confirm:hover {
            background: #b91c1c;
        }
    </style>
</head>

<body>
    <main class="container">
        <header>
            <h1>Prescriptions</h1>
            <p class="lead">Manage prescriptions without page reload.</p>
        </header>

        <section class="controls">
            <div class="control-item">
                <label for="search-input">Search</label>
                <input type="text" id="search-input" placeholder="Search prescriptions">
            </div>
            <a href="#" class="btn-add" id="btn-add" style="text-decoration: none;">Add Prescription</a>
        </section>

        <section class="appointments" aria-live="polite"></section>
    </main>

    <!-- Add/Edit Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modal-title">Add Prescription</h2>
            <input type="hidden" id="appt-id-hidden">
            <label>Prescription ID</label>
            <input type="text" id="prescription_id">
            <label>Patient ID</label>
            <input type="text" id="patient_id">
            <label>Doctor ID</label>
            <input type="text" id="doctor_id">
            <label>Medication</label>
            <input type="text" id="medication">
            <label>Dosage</label>
            <input type="text" id="dosage">
            <label>Frequency</label>
            <input type="text" id="frequency">
            <label>Start Date</label>
            <input type="datetime-local" id="start_date">
            <label>End Date</label>
            <input type="datetime-local" id="end_date">

            <div class="modal-buttons">
                <button class="btn-cancel" id="btn-cancel">Cancel</button>
                <button class="btn-save" id="btn-save">Save</button>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal" id="delete-modal">
        <div class="modal-content">
            <h2>Delete Prescription</h2>
            <p>Are you sure you want to delete this prescription?</p>
            <div class="modal-buttons">
                <button class="btn-cancel" id="delete-cancel">Cancel</button>
                <button class="btn-delete-confirm" id="delete-confirm">Delete</button>
            </div>
        </div>
    </div>

    <script>
        // SAME JAVASCRIPT AS APPOINTMENTS.HTML
        const modal = document.getElementById('modal');
        const btnAdd = document.getElementById('btn-add');
        const btnCancel = document.getElementById('btn-cancel');
        const btnSave = document.getElementById('btn-save');
        const modalTitle = document.getElementById('modal-title');

        const deleteModal = document.getElementById('delete-modal');
        const deleteCancel = document.getElementById('delete-cancel');
        const deleteConfirm = document.getElementById('delete-confirm');
        let deleteId = null;

        let editingId = null;
        let allAppointments = [];

        btnAdd.addEventListener('click', e => {
            e.preventDefault();
            modalTitle.textContent = 'Add Prescription';
            editingId = null;
            modal.classList.add('active');
            document.querySelectorAll('#modal input, #modal select, #modal textarea').forEach(i => i.value = '');
        });

        btnCancel.addEventListener('click', () => modal.classList.remove('active'));

        deleteCancel.addEventListener('click', () => deleteModal.classList.remove('active'));

        async function loadAppointments() {
            const res = await fetch('/api/prescriptions');
            allAppointments = await res.json();
            renderAppointments();
        }

        function renderAppointments() {
            const container = document.querySelector('.appointments');
            container.innerHTML = '';
            const searchText = document.getElementById('search-input').value.toLowerCase();

            const filtered = allAppointments.filter(a => {
                return !searchText || a.prescription_id.toLowerCase().includes(searchText) || (a.patient_id && a.patient_id.toLowerCase().includes(searchText));
            });

            filtered.forEach(appt => {
                const card = document.createElement('article');
                card.className = 'appt-card';
                card.innerHTML = `
      <div class="appt-main">
        <h2 class="appt-id">Prescription ID: ${appt.prescription_id}</h2>
        <div class="meta">
          <span class="badge">Patient: ${appt.patient_id}</span>
          <span class="badge">Doctor: ${appt.doctor_id}</span>
        </div>
      </div>
      <div class="appt-info">
        <div class="row">
          <dl><dt>Medication</dt><dd>${appt.medication}</dd></dl>
          <dl><dt>Dosage</dt><dd>${appt.dosage || ''}</dd></dl>
        </div>
        <div class="row">
          <dl><dt>Frequency</dt><dd>${appt.frequency || ''}</dd></dl>
          <dl><dt>Start Date</dt><dd>${new Date(appt.start_date).toLocaleString()}</dd></dl>
          <dl><dt>End Date</dt><dd>${appt.end_date ? new Date(appt.end_date).toLocaleString() : ''}</dd></dl>
        </div>
        <footer class="card-footer">
          <small>Created at: ${new Date(appt.created_at).toLocaleString()}</small>
        </footer>
        <button class="btn-edit" onclick="openEdit('${appt._id}')">Edit</button>
        <button class="btn-delete" onclick="openDelete('${appt._id}')">Delete</button>
      </div>
    `;
                container.appendChild(card);
            });
        }

        document.getElementById('search-input').addEventListener('input', renderAppointments);

        async function openEdit(id) {
            const res = await fetch('/api/prescriptions/' + id);
            const appt = await res.json();
            editingId = id;
            modalTitle.textContent = 'Edit Prescription';
            document.getElementById('prescription_id').value = appt.prescription_id;
            document.getElementById('patient_id').value = appt.patient_id;
            document.getElementById('doctor_id').value = appt.doctor_id;
            document.getElementById('medication').value = appt.medication;
            document.getElementById('dosage').value = appt.dosage || '';
            document.getElementById('frequency').value = appt.frequency || '';
            document.getElementById('start_date').value = new Date(appt.start_date).toISOString().slice(0, 16);
            document.getElementById('end_date').value = appt.end_date ? new Date(appt.end_date).toISOString().slice(0, 16) : '';
            modal.classList.add('active');
        }

        btnSave.addEventListener('click', async () => {
            const data = {
                prescription_id: document.getElementById('prescription_id').value,
                patient_id: document.getElementById('patient_id').value,
                doctor_id: document.getElementById('doctor_id').value,
                medication: document.getElementById('medication').value,
                dosage: document.getElementById('dosage').value,
                frequency: document.getElementById('frequency').value,
                start_date: document.getElementById('start_date').value,
                end_date: document.getElementById('end_date').value
            };
            if (editingId) {
                await fetch('/api/prescriptions/' + editingId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            } else {
                await fetch('/api/prescriptions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            }
            modal.classList.remove('active');
            loadAppointments();
        });

        function openDelete(id) {
            deleteId = id;
            deleteModal.classList.add('active');
        }

        deleteConfirm.addEventListener('click', async () => {
            if (deleteId) {
                await fetch('/api/prescriptions/' + deleteId, { method: 'DELETE' });
                deleteModal.classList.remove('active');
                loadAppointments();
            }
        });

        window.addEventListener('DOMContentLoaded', loadAppointments);
    </script>
</body>

</html>
