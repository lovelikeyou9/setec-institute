<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hospital Departments</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            background: #f5f7fb;
            color: #1b2230;
        }

        .container {
            max-width: 1100px;
            margin: 32px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 6px;
        }

        .lead {
            margin: 0 0 18px 0;
            color: #5b6878;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 160px;
        }

        .control-item input,
        .control-item select {
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        #search-btn,
        .btn-add {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            background: #2563eb;
            transition: .2s;
            text-decoration: none;
        }

        #search-btn:hover,
        .btn-add:hover {
            background: #1d4ed8;
        }

        .departments {
            display: grid;
            gap: 14px;
        }

        .dept-card {
            background: #fff;
            border: 1px solid #e6eef6;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            gap: 18px;
            align-items: flex-start;
            box-shadow: 0 6px 18px rgba(16, 24, 40, 0.04);
        }

        .dept-main {
            flex: 0 0 220px;
            min-width: 160px;
        }

        .dept-id {
            margin: 0 0 6px 0;
            font-size: 1.05rem;
        }

        .meta {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 6px 8px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            background: #eef2ff;
        }

        .dept-info {
            flex: 1;
            position: relative;
        }

        .row {
            display: flex;
            gap: 18px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        dt {
            font-size: 0.78rem;
            color: #475569;
            margin-bottom: 4px;
        }

        dd {
            margin: 0;
            font-weight: 600;
        }

        .card-footer {
            margin-top: 12px;
            color: #64748b;
            font-size: 0.86rem;
        }

        .btn-edit,
        .btn-delete {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            margin-top: 12px;
            margin-right: 10px;
            color: white;
        }

        .btn-edit {
            background: #10b981;
        }

        .btn-edit:hover {
            background: #059669;
        }

        .btn-delete {
            background: #ef4444;
        }

        .btn-delete:hover {
            background: #b91c1c;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90%;
            overflow: auto;
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .modal-content label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
        }

        .modal-content input,
        .modal-content select,
        .modal-content textarea {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save {
            background: #2563eb;
            color: white;
        }

        .btn-cancel {
            background: #e5e7eb;
        }

        #delete-modal .modal-content {
            text-align: center;
        }

        #delete-modal h2 {
            color: #ef4444;
            margin-bottom: 12px;
        }

        #delete-modal p {
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #475569;
        }

        #delete-modal .modal-buttons {
            justify-content: center;
        }

        .btn-delete-confirm {
            background: #ef4444;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-delete-confirm:hover {
            background: #b91c1c;
        }
    </style>
</head>

<body>
    <main class="container">
        <header>
            <h1>Departments</h1>
            <p class="lead">Manage departments without page reload.</p>
        </header>

        <section class="controls">
            <div class="control-item">
                <label for="search-input">Search</label>
                <input type="text" id="search-input" placeholder="Search departments">
            </div>
            <a href="#" class="btn-add" id="btn-add">Add Department</a>
        </section>

        <section class="departments" aria-live="polite"></section>
    </main>

    <!-- Add/Edit Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modal-title">Add Department</h2>
            <input type="hidden" id="dept-id-hidden">
            <label>Department ID</label>
            <input type="text" id="department_id">
            <label>Name</label>
            <input type="text" id="name">
            <label>Head</label>
            <input type="text" id="head">
            <label>Location</label>
            <input type="text" id="location">
            <label>Contact</label>
            <input type="text" id="contact">
            <label>Services (comma separated)</label>
            <input type="text" id="services">
            <label>Established</label>
            <input type="date" id="established">
            <div class="modal-buttons">
                <button class="btn-cancel" id="btn-cancel">Cancel</button>
                <button class="btn-save" id="btn-save">Save</button>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal" id="delete-modal">
        <div class="modal-content">
            <h2>Delete Department</h2>
            <p>Are you sure you want to delete this department?</p>
            <div class="modal-buttons">
                <button class="btn-cancel" id="delete-cancel">Cancel</button>
                <button class="btn-delete-confirm" id="delete-confirm">Delete</button>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('modal');
        const btnAdd = document.getElementById('btn-add');
        const btnCancel = document.getElementById('btn-cancel');
        const btnSave = document.getElementById('btn-save');
        const modalTitle = document.getElementById('modal-title');

        const deleteModal = document.getElementById('delete-modal');
        const deleteCancel = document.getElementById('delete-cancel');
        const deleteConfirm = document.getElementById('delete-confirm');
        let deleteId = null;

        let editingId = null;
        let allDepartments = [];

        btnAdd.addEventListener('click', e => {
            e.preventDefault();
            modalTitle.textContent = 'Add Department';
            editingId = null;
            modal.classList.add('active');
            document.querySelectorAll('#modal input').forEach(i => i.value = '');
        });

        btnCancel.addEventListener('click', () => modal.classList.remove('active'));
        deleteCancel.addEventListener('click', () => deleteModal.classList.remove('active'));

        async function loadDepartments() {
            const res = await fetch('/api/departments');
            allDepartments = await res.json();
            renderDepartments();
        }

        function renderDepartments() {
            const container = document.querySelector('.departments');
            container.innerHTML = '';
            const searchText = document.getElementById('search-input').value.toLowerCase();
            const filtered = allDepartments.filter(d => !searchText || d.name.toLowerCase().includes(searchText) || d.department_id.toLowerCase().includes(searchText));
            filtered.forEach(dept => {
                const card = document.createElement('article');
                card.className = 'dept-card';
                card.innerHTML = `
      <div class="dept-main">
        <h2 class="dept-id">ID: ${dept.department_id}</h2>
        <div class="meta">
          <span class="badge">${dept.name}</span>
        </div>
      </div>
      <div class="dept-info">
        <div class="row">
          <dl><dt>Head</dt><dd>${dept.head || ''}</dd></dl>
          <dl><dt>Location</dt><dd>${dept.location || ''}</dd></dl>
        </div>
        <div class="row">
          <dl><dt>Contact</dt><dd>${dept.contact || ''}</dd></dl>
          <dl><dt>Established</dt><dd>${dept.established ? new Date(dept.established).toLocaleDateString() : ''}</dd></dl>
        </div>
        <div class="row">
          <dl><dt>Services</dt><dd>${dept.services ? dept.services.join(', ') : ''}</dd></dl>
        </div>
        <footer class="card-footer">
          <small>Created at: ${new Date(dept.created_at || Date.now()).toLocaleString()}</small>
        </footer>
        <button class="btn-edit" onclick="openEdit('${dept._id}')">Edit</button>
        <button class="btn-delete" onclick="openDelete('${dept._id}')">Delete</button>
      </div>
    `;
                container.appendChild(card);
            });
        }

        document.getElementById('search-input').addEventListener('input', renderDepartments);

        async function openEdit(id) {
            const res = await fetch('/api/departments/' + id);
            const dept = await res.json();
            editingId = id;
            modalTitle.textContent = 'Edit Department';
            document.getElementById('department_id').value = dept.department_id;
            document.getElementById('name').value = dept.name;
            document.getElementById('head').value = dept.head || '';
            document.getElementById('location').value = dept.location || '';
            document.getElementById('contact').value = dept.contact || '';
            document.getElementById('services').value = dept.services ? dept.services.join(', ') : '';
            document.getElementById('established').value = dept.established ? new Date(dept.established).toISOString().slice(0, 10) : '';
            modal.classList.add('active');
        }

        btnSave.addEventListener('click', async () => {
            const data = {
                department_id: document.getElementById('department_id').value,
                name: document.getElementById('name').value,
                head: document.getElementById('head').value,
                location: document.getElementById('location').value,
                contact: document.getElementById('contact').value,
                services: document.getElementById('services').value.split(',').map(s => s.trim()),
                established: document.getElementById('established').value
            };
            if (editingId) {
                await fetch('/api/departments/' + editingId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            } else {
                await fetch('/api/departments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            }
            modal.classList.remove('active');
            loadDepartments();
        });

        function openDelete(id) { deleteId = id; deleteModal.classList.add('active'); }
        deleteConfirm.addEventListener('click', async () => {
            if (deleteId) {
                await fetch('/api/departments/' + deleteId, { method: 'DELETE' });
                deleteModal.classList.remove('active');
                loadDepartments();
            }
        });

        window.addEventListener('DOMContentLoaded', loadDepartments);
    </script>
</body>

</html>
