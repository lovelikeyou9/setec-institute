{% set nav = nav_for('admin', activeNav|default('')) %}
<aside class="dash-sidebar">
  <div class="brand-block">
    <strong>Admin Panel</strong>
    <span>MMT</span>
  </div>
  <nav class="dash-nav">
    <span class="dash-nav-label">Admin</span>
    <a href="{{ url('/admin') }}" class="{{ 'active' if (nav == 'dashboard') else '' }}">Dashboard</a>

    <div class="dash-nav-group {{ 'open' if (nav in ['users', 'customers', 'sellers', 'user-detail', 'seller-detail']) else '' }}">
      <button type="button" class="dash-nav-toggle {{ 'active' if (nav in ['users', 'customers', 'sellers', 'user-detail', 'seller-detail']) else '' }}"
              aria-expanded="{{ 'true' if (nav in ['users', 'customers', 'sellers', 'user-detail', 'seller-detail']) else 'false' }}">
        <span>Users</span>
        <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="dash-nav-sub">
        <a href="{{ url('/admin/users') }}" class="{{ 'active' if (nav in ['users', 'user-detail']) else '' }}">Users Lists</a>
        <a href="{{ url('/admin/users?role=CUSTOMER') }}" class="{{ 'active' if (req_input('role') == 'CUSTOMER') else '' }}">Customers Lists</a>
        <a href="{{ url('/admin/sellers') }}" class="{{ 'active' if (nav in ['sellers', 'seller-detail']) else '' }}">Sellers Lists</a>
      </div>
    </div>

    <a href="{{ url('/admin/seller-applications') }}" class="{{ 'active' if (nav == 'applications') else '' }}">Applications</a>

    <div class="dash-nav-group {{ 'open' if (nav in ['products', 'categories', 'brands']) else '' }}">
      <button type="button" class="dash-nav-toggle {{ 'active' if (nav in ['products', 'categories', 'brands']) else '' }}"
              aria-expanded="{{ 'true' if (nav in ['products', 'categories', 'brands']) else 'false' }}">
        <span>Products</span>
        <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="dash-nav-sub">
        <a href="{{ url('/admin/products') }}" class="{{ 'active' if (nav == 'products') else '' }}">Products List</a>
        <a href="{{ url('/admin/categories') }}" class="{{ 'active' if (nav == 'categories') else '' }}">Category</a>
        <a href="{{ url('/admin/brands') }}" class="{{ 'active' if (nav == 'brands') else '' }}">Brand</a>
      </div>
    </div>

    <a href="{{ url('/admin/orders') }}" class="{{ 'active' if (nav == 'orders') else '' }}">Orders</a>
    <a href="{{ url('/admin/commissions') }}" class="{{ 'active' if (nav == 'commissions') else '' }}">Commissions</a>
    <a href="{{ url('/admin/countries') }}" class="{{ 'active' if (nav == 'countries') else '' }}">Countries</a>
    <a href="{{ url('/admin/reviews') }}" class="{{ 'active' if (nav == 'reviews') else '' }}">Reviews</a>
    <a href="{{ url('/admin/settings') }}" class="{{ 'active' if (nav == 'settings') else '' }}">Settings</a>

    <span class="dash-nav-label">Account</span>
    <a href="{{ url('/account/orders') }}" class="{{ 'active' if (nav == 'my-orders') else '' }}">My Orders</a>
    <a href="{{ url('/account/wishlist') }}" class="{{ 'active' if (nav == 'wishlist') else '' }}">Wishlist</a>
    <a href="{{ url('/account/cart') }}" class="{{ 'active' if (nav == 'cart') else '' }}">Cart</a>
    <a href="{{ url('/account/notifications') }}" class="{{ 'active' if (nav == 'notifications') else '' }}">Notifications</a>
    <a href="{{ url('/account/addresses') }}" class="{{ 'active' if (nav == 'addresses') else '' }}">Addresses</a>
    <a href="{{ url('/account/settings') }}" class="{{ 'active' if (nav == 'account-settings') else '' }}">Account Settings</a>
  </nav>
</aside>
