{% set rating = rating if rating is defined else 0 %}
{% set full = [0, [5, (rating|float|round|int)]|min]|max %}
<span class="stars" aria-label="Rating {{ number_format((rating|float), 1) }} out of 5">
  {% for i in range(1, 6) %}
    <span class="{{ 'on' if (i <= full) else '' }}">&#9733;</span>
  {% endfor %}
</span>
