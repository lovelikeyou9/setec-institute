<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>VoltEdge Shop</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='style/front/styles.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='style/front/custom.css') }}" rel="stylesheet">

<style>
body {
  background: #f8f9fa;
}

.card-hover {
  transition: 0.2s;
}

.card-hover:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.product-img {
  height: 180px;
  object-fit: contain;
  padding: 12px;
  background: #fff;
}

.static-qty button {
  display: grid;
  place-items: center;
  min-width: 38px;
  min-height: 36px;
  border: 0;
  color: var(--muted, #5c6a72);
  background: var(--soft, #f3f7f9);
  font-weight: 900;
  cursor: pointer;
}

.static-qty button:hover {
  background: #e2eef0;
  color: var(--teal-dark, #075d59);
}

.cart-item-card img,
.checkout-item img {
  object-fit: contain !important;
  background: #f8f9fa;
}

.link-danger {
  border: 0;
  background: transparent;
  color: #dc3545;
  cursor: pointer;
  padding: 0;
}

.btn.disabled,
a.disabled {
  pointer-events: none;
  opacity: 0.55;
}
</style>
