{% extends "admin/master.html" %}

{% block contect %}
<main class="app-main">
  <div class="app-content-header">
    <div class="container-fluid">
      <div class="row">
        <div class="col-sm-6"><h3 class="mb-0">{{ 'Edit Category' if category else 'Add Category' }}</h3></div>
      </div>
    </div>
  </div>

  <div class="app-content">
    <div class="container-fluid">
      <a href="{{ url_for('admin_bp.category') }}" class="btn btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left-circle"></i> Back
      </a>
      <form method="POST"
            action="{{ url_for('admin_bp.do_edit_category') if category else url_for('admin_bp.do_add_category') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if category %}<input type="hidden" name="category_id" value="{{ category.id }}">{% endif %}

        <div class="form-group mb-3">
          <label>Name</label>
          <input type="text" class="form-control" name="name" required value="{{ category.name if category else '' }}">
        </div>
        <div class="form-group mb-3">
          <label>Slug (optional)</label>
          <input type="text" class="form-control" name="slug" value="{{ category.slug if category else '' }}" placeholder="auto from name">
        </div>
        <div class="form-group mb-3">
          <label>Description</label>
          <textarea class="form-control" name="description" rows="3">{{ category.description if category and category.description else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-cloud-download"></i> Save</button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
