{% extends "admin/master.html" %}

{% block contect %}
<main class="app-main">
  <div class="app-content-header">
    <div class="container-fluid">
      <div class="row">
        <div class="col-sm-6"><h3 class="mb-0">{{ 'Edit Brand' if brand else 'Add Brand' }}</h3></div>
      </div>
    </div>
  </div>

  <div class="app-content">
    <div class="container-fluid">
      <a href="{{ url_for('admin_bp.brand') }}" class="btn btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left-circle"></i> Back
      </a>
      <form method="POST"
            action="{{ url_for('admin_bp.do_edit_brand') if brand else url_for('admin_bp.do_add_brand') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if brand %}<input type="hidden" name="brand_id" value="{{ brand.id }}">{% endif %}

        <div class="form-group mb-3">
          <label>Name</label>
          <input type="text" class="form-control" name="name" required value="{{ brand.name if brand else '' }}">
        </div>
        <div class="form-group mb-3">
          <label>Slug (optional)</label>
          <input type="text" class="form-control" name="slug" value="{{ brand.slug if brand else '' }}" placeholder="auto from name">
        </div>
        <div class="form-group mb-3">
          <label>Logo URL</label>
          <input type="text" class="form-control" name="logo" value="{{ brand.logo if brand and brand.logo else '' }}">
        </div>
        <div class="form-group mb-3">
          <label>Description</label>
          <textarea class="form-control" name="description" rows="3">{{ brand.description if brand and brand.description else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-cloud-download"></i> Save</button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
