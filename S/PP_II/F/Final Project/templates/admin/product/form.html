{% extends "admin/master.html" %}

{% block contect %}
<main class="app-main">
  <div class="app-content-header">
    <div class="container-fluid">
      <div class="row">
        <div class="col-sm-6"><h3 class="mb-0">{{ 'Edit Product' if product else 'Add Product' }}</h3></div>
      </div>
    </div>
  </div>

  <div class="app-content">
    <div class="container-fluid">
      <a href="{{ url_for('admin_bp.product_list') }}" class="btn btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left-circle"></i> Back
      </a>
      <form method="POST"
            action="{{ url_for('admin_bp.do_edit_product') if product else url_for('admin_bp.do_add_product') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if product %}<input type="hidden" name="product_id" value="{{ product.id }}">{% endif %}

        <div class="form-group mb-3">
          <label>Title</label>
          <input type="text" class="form-control" name="title" required value="{{ product.title if product else '' }}">
        </div>
        <div class="row">
          <div class="col-md-4 form-group mb-3">
            <label>Price</label>
            <input type="number" step="0.01" class="form-control" name="price" required value="{{ product.price if product else '0' }}">
          </div>
          <div class="col-md-4 form-group mb-3">
            <label>Brand</label>
            <select class="form-control" name="brand_id">
              <option value="">— Select —</option>
              {% for b in brands %}
              <option value="{{ b.id }}" {% if product and product.brand_id == b.id %}selected{% endif %}>{{ b.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4 form-group mb-3">
            <label>Category</label>
            <select class="form-control" name="category_id">
              <option value="">— Select —</option>
              {% for c in categories %}
              <option value="{{ c.id }}" {% if product and product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="form-group mb-3">
          <label>Image URL</label>
          <input type="text" class="form-control" name="image" value="{{ product.image if product and product.image else '' }}">
        </div>
        <div class="form-group mb-3">
          <label>Description</label>
          <textarea class="form-control" name="description" rows="4">{{ product.description if product and product.description else '' }}</textarea>
        </div>
        <div class="row">
          <div class="col-md-4 form-group mb-3">
            <label>Rating</label>
            <input type="number" step="0.1" class="form-control" name="rating_rate" value="{{ product.rating_rate if product else '0' }}">
          </div>
          <div class="col-md-4 form-group mb-3">
            <label>Rating count</label>
            <input type="number" class="form-control" name="rating_count" value="{{ product.rating_count if product else '0' }}">
          </div>
          <div class="col-md-4 form-group mb-3">
            <label>Active</label>
            <select class="form-control" name="is_active">
              <option value="1" {% if not product or product.is_active %}selected{% endif %}>Yes</option>
              <option value="0" {% if product and not product.is_active %}selected{% endif %}>No</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-cloud-download"></i> Save</button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
