{% extends "admin/master.html" %}

{% block contect %}
<main class="app-main">
  <div class="app-content-header">
    <div class="container-fluid">
      <div class="row">
        <div class="col-sm-6"><h3 class="mb-0">Category</h3></div>
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-end">
            <li class="breadcrumb-item"><a href="{{ url_for('admin_bp.dashboard') }}">Home</a></li>
            <li class="breadcrumb-item active">Category</li>
          </ol>
        </div>
      </div>
    </div>
  </div>

  <div class="app-content">
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-12 mb-3">
          <a href="{{ url_for('admin_bp.add_category') }}" class="btn btn-outline-primary">
            <i class="bi bi-plus-circle"></i> Add Category
          </a>
        </div>
        <div class="card-body">
          <table class="table table-bordered table-striped">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Slug</th>
                <th>Description</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              {% for c in categories %}
              <tr>
                <td>{{ c.id }}</td>
                <td>{{ c.name }}</td>
                <td>{{ c.slug }}</td>
                <td>{{ (c.description or '')[:60] }}</td>
                <td>
                  <a href="{{ url_for('admin_bp.edit_category', category_id=c.id) }}" class="me-2"><i class="bi bi-pencil-square"></i></a>
                  <a href="{{ url_for('admin_bp.delete_category', category_id=c.id) }}" class="btn btn-sm btn-outline-danger"
                     onclick="return confirm('Delete this category?')"><i class="bi bi-trash"></i></a>
                </td>
              </tr>
              {% else %}
              <tr><td colspan="5" class="text-center text-muted">No categories yet.</td></tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
