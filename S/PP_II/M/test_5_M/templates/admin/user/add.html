
{% extends "admin/master.html" %}

{% block contect %}

  <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">
          <div class="row">
            <div class="col-sm-6">
              <h3 class="mb-0">User</h3>
            </div>
            <div class="col-sm-6">
              <ol class="breadcrumb float-sm-end">
                <li class="breadcrumb-item"><a href="#">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">User</li>
              </ol>
            </div>
          </div>
          <!--end::Row-->
        </div>
        <!--end::Container-->
      </div>

      <div class="app-content">
        <div class="container-fluid">

          <div class="row">

            <div class="col-md-12">
              <h3 class="card-title">
                <a href="{{ url_for('user') }}" class="btn btn-outline-secondary float-right"><i class="bi bi-arrow-left-circle"></i>Back</a>
              </h3>
            </div>

            <div class="card-body">
              <form action="#" method="post">
                <div class="form-group mb-3">
                  <center>
                    <img src="{{ url_for('static', filename='admin/avatar.png') }}" alt="Profile" width="100px" height="100px" style="padding: 10px; border-radius: 50%;">
                    <input type="file" class="form-control" id="profile">
                  </center>
                </div>

                <div class="form-group">
                  <label for="name">Name</label>
                  <input type="text" class="form-control" id="name" placeholder="Enter Name">
                </div>
                <div class="form-group">
                  <label for="email">Email</label>
                  <input type="email" class="form-control" id="email" placeholder="Enter Email">
                </div>
                <div class="form-group">
                  <label for="password">Password</label>
                  <input type="password" class="form-control" id="password" placeholder="Enter Password">
                </div>
                <div class="separator mb-4"></div>
                <button type="submit" class="btn btn-primary float-end"><i class="bi bi-cloud-download"></i>Save</button>
                <button type="reset" class="btn btn-danger"><i class="bi bi-x-circle"></i>Reset</button>
              </form>
            </div>

          </div>

        </div>

      </div>
  </main>

{% endblock %}
