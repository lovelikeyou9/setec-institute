<!doctype html>
<html lang="en">
<head>
  {% include 'front/share/header.html' %}
</head>

<body class="ve-home">

{% include 'front/share/navbar.html' %}

<main class="ve-auth-page">
  <section class="ve-auth-card">
    <p class="ve-eyebrow-sm">Password help</p>
    <h1>Reset your password</h1>
    <p class="text-muted mb-4">Enter your email address and receive a password reset link.</p>

    <form>
      <div class="mb-4">
        <label class="ve-form-label" for="resetEmail">Email</label>
        <input class="form-control ve-form-control" id="resetEmail" type="email" placeholder="alex@example.com">
      </div>
      <a class="ve-btn-primary w-100 text-center text-decoration-none d-block" href="{{ url_for('login') }}">Send reset link</a>
    </form>

    <p class="text-center text-muted mt-4 mb-0">Remembered your password? <a class="ve-link" href="{{ url_for('login') }}">Back to login</a></p>
  </section>
</main>

{% include 'front/share/footer.html' %}

</body>
</html>
