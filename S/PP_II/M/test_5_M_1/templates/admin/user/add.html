
{% extends "admin/master.html" %}

{% block contect %}

  <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">
          <div class="row">
            <div class="col-sm-6">
              <h3 class="mb-0">Add User</h3>
            </div>
            <div class="col-sm-6">
              <ol class="breadcrumb float-sm-end">
                <li class="breadcrumb-item"><a href="#">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">User</li>
              </ol>
            </div>
          </div>
        </div>
      </div>

      <div class="app-content">
        <div class="container-fluid">

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                  {{ message }}
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <div class="row">

            <div class="col-md-12">
              <h3 class="card-title">
                <a href="{{ url_for('user') }}" class="btn btn-outline-secondary float-end"><i class="bi bi-arrow-left-circle"></i> Back</a>
              </h3>
            </div>

            <div class="card-body">
              <form action="{{ url_for('add_user') }}" method="post">
                <div class="form-group mb-3">
                  <center>
                    <img src="{{ url_for('static', filename='admin/avatar.png') }}" alt="Profile" width="100px" height="100px" style="padding: 10px; border-radius: 50%;">
                  </center>
                </div>

                <div class="form-group mb-3">
                  <label for="name">Name</label>
                  <input type="text" class="form-control" id="name" name="name" placeholder="Enter Name" required>
                </div>
                <div class="form-group mb-3">
                  <label for="email">Email</label>
                  <input type="email" class="form-control" id="email" name="email" placeholder="Enter Email" required>
                </div>
                <div class="form-group mb-3">
                  <label for="password">Password</label>
                  <input type="password" class="form-control" id="password" name="password" placeholder="Enter Password" required>
                </div>
                <div class="form-group mb-3">
                  <label for="role">Role</label>
                  <select class="form-control" id="role" name="role">
                    <option value="user">user</option>
                    <option value="admin">admin</option>
                  </select>
                </div>
                <div class="form-group mb-3">
                  <label for="status">Status</label>
                  <select class="form-control" id="status" name="status">
                    <option value="active">active</option>
                    <option value="inactive">inactive</option>
                  </select>
                </div>
                <div class="separator mb-4"></div>
                <button type="submit" class="btn btn-primary float-end"><i class="bi bi-cloud-download"></i> Save</button>
                <button type="reset" class="btn btn-danger"><i class="bi bi-x-circle"></i> Reset</button>
              </form>
            </div>

          </div>

        </div>

      </div>
  </main>

{% endblock %}
