<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Computer Store</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .checkout-container { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; margin-top: 30px; }
        .form-section { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .order-summary { background: #f8fafc; padding: 30px; border-radius: 12px; height: fit-content; border: 1px solid #e2e8f0; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
        
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; color: #64748b; }
        .summary-total { border-top: 2px solid #e2e8f0; padding-top: 15px; margin-top: 15px; font-weight: bold; font-size: 1.2rem; color: #1e293b; display: flex; justify-content: space-between; }
        
        .cart-item-mini { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; }
        .cart-item-mini img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
        .cart-item-mini div { flex: 1; }
        
        @media (max-width: 900px) { .checkout-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-logo">ComputerStore</a>
            <div class="nav-right">
                <a href="/cart" class="cart-icon"><i class="fas fa-shopping-cart"></i></a>
            </div>
        </div>
    </nav>

    <div class="container checkout-container">
        <!-- LEFT: Shipping Form -->
        <div>
            <div class="form-section">
                <h2 style="margin-bottom: 20px;">Shipping Information</h2>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" class="form-control" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address" class="form-control" placeholder="123 Tech St">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="city" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Zip Code</label>
                        <input type="text" id="zip" class="form-control">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2 style="margin-bottom: 20px;">Payment</h2>
                <div style="padding: 15px; border: 2px solid #2563eb; border-radius: 8px; background: #eff6ff; color: #2563eb; font-weight: 500;">
                    <i class="far fa-credit-card"></i> Credit Card (Simulator)
                </div>
            </div>
        </div>

        <!-- RIGHT: Order Summary -->
        <div class="order-summary">
            <h3 style="margin-bottom: 20px;">Order Summary</h3>
            
            <!-- Items Container (Will be filled by JS) -->
            <div id="checkoutItemsList" style="margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">
                Loading items...
            </div>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="summSubtotal">$0.00</span>
            </div>
            <div class="summary-row">
                <span>Shipping</span>
                <span id="summShipping">$9.99</span>
            </div>
            <div class="summary-row">
                <span>Tax (8%)</span>
                <span id="summTax">$0.00</span>
            </div>
            <div class="summary-total">
                <span>Total</span>
                <span id="summTotal">$0.00</span>
            </div>

            <button class="btn btn-primary w-100" onclick="placeOrder()" style="margin-top: 20px;">
                Place Order
            </button>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadCheckoutData);

        async function loadCheckoutData() {
            try {
                // Fetch the real cart from the server
                const res = await fetch('/api/cart');
                const data = await res.json();
                const cart = data.cart || [];

                if (cart.length === 0) {
                    window.location.href = '/cart'; // Redirect if empty
                    return;
                }

                // 1. Calculate Totals
                const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const tax = subtotal * 0.08;
                const shipping = subtotal > 100 ? 0 : 9.99;
                const total = subtotal + tax + shipping;

                // 2. Display Items
                const list = document.getElementById('checkoutItemsList');
                list.innerHTML = cart.map(item => `
                    <div class="cart-item-mini">
                        <img src="${item.image}" alt="${item.name}">
                        <div>
                            <div style="font-weight:600; font-size:0.9rem;">${item.name}</div>
                            <div style="color:#64748b; font-size:0.8rem;">Qty: ${item.quantity}</div>
                        </div>
                        <div style="font-weight:600;">$${(item.price * item.quantity).toFixed(2)}</div>
                    </div>
                `).join('');

                // 3. Display Totals
                document.getElementById('summSubtotal').innerText = `$${subtotal.toFixed(2)}`;
                document.getElementById('summTax').innerText = `$${tax.toFixed(2)}`;
                document.getElementById('summShipping').innerText = shipping === 0 ? 'FREE' : `$${shipping.toFixed(2)}`;
                document.getElementById('summTotal').innerText = `$${total.toFixed(2)}`;

            } catch (err) {
                console.error(err);
            }
        }

        async function placeOrder() {
            const btn = document.querySelector('button[onclick="placeOrder()"]');
            const originalText = btn.innerText;
            btn.innerText = "Processing...";
            btn.disabled = true;

            const shippingData = {
                recipientName: document.getElementById('fullName').value || 'Guest',
                street: document.getElementById('address').value || '123 Main St',
                city: document.getElementById('city').value || 'City',
                zipCode: document.getElementById('zip').value || '00000',
                country: 'USA'
            };

            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        shippingAddress: shippingData,
                        paymentMethod: 'credit_card'
                    })
                });

                const data = await res.json();
                if (data.success) {
                    alert('🎉 Order Placed Successfully!');
                    window.location.href = '/profile'; // Redirect to see order history
                } else {
                    alert('❌ Error: ' + data.error);
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                alert('Network Error');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
