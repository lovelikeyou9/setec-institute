<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Computer Store</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-container { padding: 40px 0; display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
        .admin-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th,td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8fafc; font-weight: 600; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
        .badge-pending { background: #fef3c7; color: #b45309; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-logo"><i class="fas fa-shield-alt"></i> AdminPanel</a>
            <div class="nav-right">
                <a href="/" class="btn btn-outline btn-sm">View Store</a>
            </div>
        </div>
    </nav>

    <div class="container admin-container">
        <!-- Add Product Form -->
        <div class="admin-card">
            <h2><i class="fas fa-plus-circle"></i> Add Product</h2>
            <form id="addProductForm">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="pName" class="form-control" required placeholder="e.g. RTX 4080">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="pDesc" class="form-control" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Price ($)</label>
                    <input type="number" id="pPrice" class="form-control" required step="0.01">
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" id="pImage" class="form-control" placeholder="https://..." required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="pCategory" class="form-control">
                        <!-- Populated by JS -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="pQty" class="form-control" value="10">
                </div>
                <button type="submit" class="btn btn-primary w-100">Add Product</button>
            </form>
        </div>

        <!-- All Orders List -->
        <div class="admin-card">
            <h2><i class="fas fa-list"></i> Recent Orders</h2>
            <table>
                <thead>
                    <tr>
                        <th>Order #</th>
                        <th>Customer</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr><td colspan="5">Loading orders...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
