<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Computer Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .cart-page {
            min-height: 70vh;
            padding: 40px 0;
        }
        
        .cart-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }
        
        .cart-items {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .cart-summary {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 100px;
        }
        
        .cart-item {
            display: grid;
            grid-template-columns: 100px 2fr 1fr auto;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
            align-items: center;
        }
        
        .cart-item:last-child {
            border-bottom: none;
        }
        
        .cart-item-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .cart-item-details h4 {
            margin-bottom: 5px;
            font-size: 1.1rem;
        }
        
        .cart-item-category {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        
        .cart-item-price {
            color: #2563eb;
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .quantity-btn {
            width: 35px;
            height: 35px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .quantity-btn:hover {
            background: #f8f9fa;
        }
        
        .quantity-input {
            width: 50px;
            text-align: center;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        
        .item-total {
            font-weight: bold;
            font-size: 1.2rem;
            text-align: right;
            min-width: 100px;
        }
        
        .remove-item {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
            border-radius: 5px;
        }
        
        .remove-item:hover {
            background: #fee2e2;
        }
        
        .cart-empty {
            text-align: center;
            padding: 60px 20px;
        }
        
        .cart-empty i {
            font-size: 4rem;
            color: #ddd;
            margin-bottom: 20px;
        }
        
        .cart-empty h2 {
            margin-bottom: 10px;
            color: #666;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .summary-row.total {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2563eb;
            border-bottom: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
        
        .checkout-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            font-size: 1.1rem;
        }
        
        .continue-shopping {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
        }
        
        @media (max-width: 992px) {
            .cart-container {
                grid-template-columns: 1fr;
            }
            
            .cart-summary {
                position: static;
            }
        }
        
        @media (max-width: 768px) {
            .cart-item {
                grid-template-columns: 80px 1fr;
                gap: 15px;
            }
            
            .cart-item-details {
                grid-column: 2;
            }
            
            .quantity-controls, .item-total, .remove-item {
                grid-column: 1 / -1;
                justify-self: start;
                margin-top: 10px;
            }
            
            .item-total, .remove-item {
                justify-self: end;
                margin-top: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-logo">
                <i class="fas fa-desktop"></i>
                <span>ComputerStore</span>
            </a>
            
            <ul class="nav-menu">
                <li><a href="/"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="/products"><i class="fas fa-laptop"></i> Products</a></li>
                <li><a href="/cart" class="active"><i class="fas fa-shopping-cart"></i> Cart</a></li>
                <li><a href="/about"><i class="fas fa-info-circle"></i> About</a></li>
            </ul>
            
            <div class="nav-right">
                <div class="search-container">
                    <form id="searchForm">
                        <input type="text" class="search-input" placeholder="Search products..." id="searchInput">
                        <button type="submit" class="search-btn"><i class="fas fa-search"></i></button>
                    </form>
                </div>
                
                <a href="/cart" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
                
                <div class="auth-links" id="guestLinks">
                    <a href="/login" class="btn btn-outline btn-sm">Login</a>
                    <a href="/register" class="btn btn-primary btn-sm">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <div class="container">
            <ol>
                <li><a href="/">Home</a></li>
                <li><i class="fas fa-chevron-right"></i></li>
                <li>Shopping Cart</li>
            </ol>
        </div>
    </div>

    <!-- Cart Content -->
    <div class="container cart-page">
        <h1 class="section-title">Shopping Cart</h1>
        
        <div id="cartContent">
            <!-- Cart will be loaded here by JavaScript -->
            <div class="loading-spinner">Loading cart...</div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>ComputerStore</h3>
                <p>Your one-stop shop for all computer needs.</p>
            </div>
            <div class="footer-section">
                <h3>Quick Links</h3>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/products">Products</a></li>
                    <li><a href="/cart">Cart</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h3>Contact</h3>
                <p><i class="fas fa-envelope"></i> info@computerstore.com</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2024 Computer Store</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
