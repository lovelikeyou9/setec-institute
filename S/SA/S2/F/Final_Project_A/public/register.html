<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Register | Join Platform</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Navigation bar placeholder -->
  <header id="main-nav"></header>
  <main class="auth-page">
    <div class="glass-card auth-card">
      <div class="auth-header">
        <h2>Join <span class="gradient-text">Apex</span></h2>
        <p>Register as a buyer or premium seller to get started.</p>
      </div>
      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="email@dealer.com" required>
        </div>
        <div class="form-group">
          <label for="password">Choose Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label for="role">Account Type</label>
          <select id="role" required style="cursor:pointer;">
            <option value="buyer">Customer / Buyer</option>
            <option value="seller">Showroom Seller</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:12px;"><i
            class="ti ti-user-plus"></i> Create Account</button>
      </form>
      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </main>
  <!-- Client Footer -->
  <footer class="client-footer">
    <div class="container">
      <p style="font-size:12px; color:hsl(var(--text-muted));">
        Copyright &copy; 2026 Apex Motors. All Rights Reserved.
      </p>
    </div>
  </footer>
  <!-- Scripts -->
  <script src="js/app.js"></script>
</body>

</html>
