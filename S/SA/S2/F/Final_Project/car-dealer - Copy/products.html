<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Car Products</title>

    <!-- Bootstrap -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="container">

            <nav class="navbar navbar-expand-lg navbar-dark">

                <a class="navbar-brand logo"
                    href="main.html">

                    CarDealer

                </a>

                <button class="navbar-toggler"
                    type="button"
                    data-toggle="collapse"
                    data-target="#navbarNav">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse"
                    id="navbarNav">

                    <ul class="navbar-nav ml-auto">

                        <li class="nav-item">
                            <a class="nav-link"
                                href="main.html">

                                Home

                            </a>
                        </li>

                        <li class="nav-item active">
                            <a class="nav-link"
                                href="products.html">

                                Cars

                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                                href="cart.html">

                                Cart

                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                                href="checkout.html">

                                Checkout

                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                                href="login.html">

                                Login

                            </a>
                        </li>

                    </ul>

                </div>

            </nav>

        </div>

    </header>

    <!-- HERO -->

    <section class="product-hero">

        <div class="container">

            <h1>
                Luxury Cars Collection
            </h1>

            <p>
                Explore premium vehicles from top brands
            </p>

        </div>

    </section>

    <!-- SEARCH -->

    <section class="search-section">

        <div class="container">

            <div class="row">

                <div class="col-md-6">

                    <input type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Search Car...">

                </div>

                <div class="col-md-3">

                    <select id="brandFilter"
                        class="form-control">

                        <option value="">
                            All Brands
                        </option>

                        <option value="BMW">
                            BMW
                        </option>

                        <option value="Mercedes">
                            Mercedes
                        </option>

                        <option value="Audi">
                            Audi
                        </option>

                        <option value="Lamborghini">
                            Lamborghini
                        </option>

                        <option value="Ferrari">
                            Ferrari
                        </option>

                    </select>

                </div>

                <div class="col-md-3">

                    <button class="btn btn-dark btn-block"
                        onclick="filterProducts()">

                        Search

                    </button>

                </div>

            </div>

        </div>

    </section>

    <!-- PRODUCTS -->

    <section class="products-section">

        <div class="container">

            <div class="row"
                id="productList">

                <!-- Dynamic Products -->

            </div>

        </div>

    </section>

    <!-- FOOTER -->

    <footer class="footer">

        <div class="container">

            <div class="row">

                <div class="col-md-4">

                    <h3>
                        Car Dealer
                    </h3>

                    <p>
                        Premium luxury car dealer website.
                    </p>

                </div>

                <div class="col-md-4">

                    <h3>
                        Quick Links
                    </h3>

                    <ul class="footer-links">

                        <li>
                            <a href="main.html">
                                Home
                            </a>
                        </li>

                        <li>
                            <a href="products.html">
                                Products
                            </a>
                        </li>

                        <li>
                            <a href="cart.html">
                                Cart
                            </a>
                        </li>

                        <li>
                            <a href="login.html">
                                Login
                            </a>
                        </li>

                    </ul>

                </div>

                <div class="col-md-4">

                    <h3>
                        Contact
                    </h3>

                    <p>
                        Email: cardealer@gmail.com
                    </p>

                    <p>
                        Phone: +855 12 345 678
                    </p>

                </div>

            </div>

        </div>

    </footer>

    <!-- JS -->

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/products.js"></script>

</body>

</html>
