<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Dealer System</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f4f4;
}

/* HEADER */
header {
    background: #111;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    font-size: 24px;
}

nav a {
    color: white;
    margin: 0 10px;
    text-decoration: none;
}

/* HERO */
.hero {
    height: 250px;
    background: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70') center/cover;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 32px;
    font-weight: bold;
}

/* CONTAINER */
.container {
    display: flex;
    padding: 20px;
}

/* SIDEBAR */
aside {
    width: 25%;
    background: white;
    padding: 15px;
    margin-right: 20px;
    border-radius: 10px;
}

aside h3 {
    margin-bottom: 10px;
}

aside input {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
}

/* MAIN */
main {
    width: 75%;
}

/* CAR GRID */
.car-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.car-card {
    background: white;
    padding: 10px;
    border-radius: 10px;
    box-shadow: 0 0 5px rgba(0,0,0,0.2);
}

.car-card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
}

.car-card h4 {
    margin: 10px 0;
}

.price {
    color: green;
    font-weight: bold;
}

/* BUTTON */
button {
    padding: 8px 12px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
    margin-top: 5px;
}

/* FOOTER */
footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 20px;
}

/* FORM */
.form-box {
    margin-top: 20px;
    background: white;
    padding: 10px;
    border-radius: 10px;
}

.form-box input {
    width: 100%;
    padding: 8px;
    margin: 5px 0;
}
</style>

</head>
<body>

<header>
    <h1>🚗 Car Dealer System</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Cars</a>
        <a href="#">Sell Car</a>
        <a href="#">Contact</a>
    </nav>
</header>

<div class="hero">
    Find Your Dream Car
</div>

<div class="container">

    <!-- SIDEBAR -->
    <aside>
        <h3>Search Cars</h3>
        <input type="text" id="searchBox" placeholder="Search car..." onkeyup="searchCar()">

        <h3>Add Car</h3>
        <div class="form-box">
            <input type="text" id="name" placeholder="Car Name">
            <input type="number" id="price" placeholder="Price">
            <input type="text" id="image" placeholder="Image URL">
            <button onclick="addCar()">Add Car</button>
        </div>
    </aside>

    <!-- MAIN -->
    <main>
        <h2>Available Cars</h2>
        <div class="car-grid" id="carList"></div>
    </main>

</div>

<footer>
    © 2026 Car Dealer System | Built with HTML + JS + MongoDB API
</footer>

<script>

// API BASE (Node.js + Express backend)
const API = "http://localhost:3000/api/cars";

// LOAD CARS
async function loadCars() {
    const res = await fetch(API);
    const cars = await res.json();

    let html = "";
    cars.forEach(car => {
        html += `
        <div class="car-card">
            <img src="${car.image}" />
            <h4>${car.name}</h4>
            <p class="price">$${car.price}</p>
            <button onclick="deleteCar('${car._id}')">Delete</button>
        </div>
        `;
    });

    document.getElementById("carList").innerHTML = html;
}

// ADD CAR
async function addCar() {
    const name = document.getElementById("name").value;
    const price = document.getElementById("price").value;
    const image = document.getElementById("image").value;

    await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, price, image })
    });

    loadCars();
}

// DELETE CAR
async function deleteCar(id) {
    await fetch(`${API}/${id}`, {
        method: "DELETE"
    });

    loadCars();
}

// SEARCH CAR (frontend filter)
function searchCar() {
    let input = document.getElementById("searchBox").value.toLowerCase();
    let cards = document.getElementsByClassName("car-card");

    for (let i = 0; i < cards.length; i++) {
        let name = cards[i].getElementsByTagName("h4")[0].innerText.toLowerCase();

        if (name.includes(input)) {
            cards[i].style.display = "block";
        } else {
            cards[i].style.display = "none";
        }
    }
}

// INIT
loadCars();

</script>

</body>
</html>
