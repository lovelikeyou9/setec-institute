<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>
                Create Account
            </h1>

            <input type="text"
                id="username"
                class="form-control mb-3"
                placeholder="Username">

            <input type="email"
                id="email"
                class="form-control mb-3"
                placeholder="Email">

            <input type="password"
                id="password"
                class="form-control mb-3"
                placeholder="Password">

            <button class="btn btn-dark btn-block"
                onclick="register()">

                Register

            </button>

        </div>

    </div>

    <script src="js/register.js"></script>

</body>

</html>
