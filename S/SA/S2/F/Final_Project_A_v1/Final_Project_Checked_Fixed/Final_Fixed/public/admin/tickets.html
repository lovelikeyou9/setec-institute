<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Portal | Support Desk Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <!-- Re-use main client style file elements for chat bubble styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>

<body>
    <!-- TOPBAR HEADER -->
    <nav id="topbar" class="navbar fixed-top px-3 d-flex justify-content-end align-items-center">
    </nav>
    <!-- SIDEBAR NAVIGATION MENU -->
    <aside id="sidebar" class="sidebar">
        <div class="logo-area">
            <div class="logo-text"><i class="ti ti-car"></i> APEX <span>PORTAL</span></div>
        </div>
        <div class="d-flex align-items-center gap-3 p-4 border-bottom border-secondary border-opacity-25">
            <div id="admin-avatar-text" class="seller-avatar bg-primary text-dark"
                style="width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700;">
                A</div>
            <div>
                <h4 id="admin-profile-name" class="mb-0 fs-6 fw-bold">Admin User</h4>
                <small id="admin-profile-role" class="text-muted text-uppercase" style="font-size:10px;">Role</small>
            </div>
        </div>
        <ul id="admin-sidebar-nav" class="nav flex-column gap-1 p-3"></ul>
    </aside>
    <!-- TICKETS OPERATOR HUB -->
    <main id="content">
        <div class="container-fluid">

            <div class="row mb-4">
                <div class="col-12">
                    <h1 class="fs-3 mb-1 fw-bold">Support Desk Hub</h1>
                    <p class="text-muted mb-0">Respond to customer technical support tickets in real-time chat.</p>
                </div>
            </div>
            <!-- Multi-column Layout -->
            <div class="row g-4">
                <!-- 1. Ticket Queue List -->
                <div class="col-lg-4 col-12">
                    <div class="card h-100">
                        <div class="card-header"><i class="ti ti-mail"></i> Active Queue</div>
                        <div class="card-body p-0" id="admin-tickets-list" style="max-height: 500px; overflow-y: auto;">
                        </div>
                    </div>
                </div>
                <!-- 2. Chat Conversation Pane -->
                <div class="col-lg-8 col-12">
                    <div id="admin-chat-pane" style="display:none;" class="card h-100">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span id="admin-chat-subject" class="fw-bold">Subject</span>
                            <button id="admin-resolve-ticket-btn" class="btn btn-success btn-sm"><i
                                    class="ti ti-check"></i> Resolve Ticket</button>
                        </div>

                        <div class="card-body d-flex flex-column" style="height: 480px;">
                            <!-- Chronological chat box wrapper -->
                            <div id="admin-chat-box"
                                class="chat-box flex-grow-1 mb-3 d-flex flex-column overflow-y-auto p-3"
                                style="border:1px solid var(--glass-border); border-radius:12px; background:rgba(255,255,255,0.01);">
                            </div>

                            <!-- Reply input form -->
                            <form id="admin-chat-send-form" class="d-flex gap-2">
                                <textarea id="admin-chat-input" class="form-control"
                                    placeholder="Type support response message..." rows="1" required
                                    style="resize:none; height:46px;"></textarea>
                                <button type="submit" class="btn btn-primary" style="height:46px; border-radius:8px;"><i
                                        class="ti ti-send"></i> Send</button>
                            </form>
                        </div>
                    </div>

                    <div id="admin-chat-empty"
                        class="card h-100 d-flex align-items-center justify-content-center text-center p-5 text-muted"
                        style="min-height:480px;">
                        <div>
                            <i class="ti ti-messages"
                                style="font-size: 64px; color: var(--glass-border); margin-bottom:16px;"></i>
                            <h3>No Ticket Selected</h3>
                            <p class="small">Choose an inbound inquiry from the active queue to start chatting.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/admin.js"></script>
    <script>
        // Bind simple toggling visibility logic
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new MutationObserver(() => {
                const chatPane = document.getElementById('admin-chat-pane');
                const emptyPane = document.getElementById('admin-chat-empty');
                if (chatPane && emptyPane) {
                    if (chatPane.style.display === 'block') {
                        emptyPane.style.display = 'none';
                    } else {
                        emptyPane.style.display = 'flex';
                    }
                }
            });
            const chatPane = document.getElementById('admin-chat-pane');
            if (chatPane) observer.observe(chatPane, { attributes: true, attributeFilter: ['style'] });
        });
    </script>
</body>

</html>
