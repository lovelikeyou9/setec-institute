<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Showroom | Explore Luxury Selection</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Header Dynamic Navigation -->
  <header id="main-nav"></header>
  <main class="container" style="padding-top: 130px; margin-bottom: 80px;">
    <div class="section-header" style="margin-bottom: 32px;">
      <div class="section-title">
        <h2>Showroom <span class="gradient-text">Showcase</span></h2>
        <p id="active-results-count">Analyzing showroom listings...</p>
      </div>
    </div>
    <!-- Multi-Column Layout -->
    <div style="display:grid; grid-template-columns: 300px 1fr; gap:32px; align-items: start;">

      <!-- 1. Sidebar Filter Module -->
      <aside class="glass-card" style="position: sticky; top: 100px;">
        <h3
          style="font-size:18px; font-weight:700; margin-bottom:20px; padding-bottom:10px; border-bottom:1px solid var(--glass-border);">
          <i class="ti ti-adjustments-horizontal"></i> Filters</h3>

        <div style="display:flex; flex-direction:column; gap:20px;">
          <!-- Search -->
          <div class="filter-group">
            <label for="browse-search">Search Keyword</label>
            <input type="text" id="browse-search" placeholder="Model, year, keyword...">
          </div>
          <!-- Make -->
          <div class="filter-group">
            <label for="browse-make">Manufacturer</label>
            <select id="browse-make">
              <option value="">All Brands</option>
              <option value="Tesla">Tesla</option>
              <option value="Porsche">Porsche</option>
              <option value="Ford">Ford</option>
              <option value="Audi">Audi</option>
              <option value="Land Rover">Land Rover</option>
            </select>
          </div>
          <!-- Body Type -->
          <div class="filter-group">
            <label for="browse-body">Body Style</label>
            <select id="browse-body">
              <option value="">All Types</option>
              <option value="Sedan">Sedan</option>
              <option value="Coupe">Coupe</option>
              <option value="SUV">SUV</option>
            </select>
          </div>
          <!-- Condition -->
          <div class="filter-group">
            <label for="browse-condition">Condition</label>
            <select id="browse-condition">
              <option value="">Any Condition</option>
              <option value="New">New</option>
              <option value="Used">Used</option>
            </select>
          </div>
          <!-- Transmission -->
          <div class="filter-group">
            <label for="browse-transmission">Transmission</label>
            <select id="browse-transmission">
              <option value="">Any Gearbox</option>
              <option value="Automatic">Automatic</option>
              <option value="Manual">Manual</option>
            </select>
          </div>
          <!-- Price Range -->
          <div class="filter-group">
            <label for="browse-price">Maximum Price ($)</label>
            <input type="number" id="browse-price" placeholder="e.g. 150000" min="0">
          </div>
        </div>
      </aside>
      <!-- 2. Showroom Catalog List -->
      <section>
        <div id="showroom-cars-grid" class="cars-grid"
          style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));"></div>
      </section>
    </div>
  </main>
  <!-- Client Footer -->
  <footer class="client-footer">
    <div class="container">
      <h3 style="font-size:22px; font-weight:800; margin-bottom:16px;"><i class="ti ti-car"></i> APEX MOTORS</h3>
      <p
        style="border-top: 1px solid var(--glass-border); padding-top:24px; font-size:12px; color:hsl(var(--text-muted));">
        Copyright &copy; 2026 Apex Motors Showroom. All Rights Reserved.
      </p>
    </div>
  </footer>
  <!-- Scripts -->
  <script src="js/app.js"></script>
</body>

</html>
