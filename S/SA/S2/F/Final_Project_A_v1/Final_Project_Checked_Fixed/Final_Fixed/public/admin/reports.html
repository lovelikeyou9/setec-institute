<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Portal | Financial Ledgers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>

<body>
    <!-- TOPBAR HEADER -->
    <nav id="topbar" class="navbar fixed-top px-3 d-flex justify-content-end align-items-center">
    </nav>
    <!-- SIDEBAR NAVIGATION MENU -->
    <aside id="sidebar" class="sidebar">
        <div class="logo-area">
            <div class="logo-text"><i class="ti ti-car"></i> APEX <span>PORTAL</span></div>
        </div>
        <div class="d-flex align-items-center gap-3 p-4 border-bottom border-secondary border-opacity-25">
            <div id="admin-avatar-text" class="seller-avatar bg-primary text-dark"
                style="width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700;">
                A</div>
            <div>
                <h4 id="admin-profile-name" class="mb-0 fs-6 fw-bold">Admin User</h4>
                <small id="admin-profile-role" class="text-muted text-uppercase" style="font-size:10px;">Role</small>
            </div>
        </div>
        <ul id="admin-sidebar-nav" class="nav flex-column gap-1 p-3"></ul>
    </aside>
    <!-- REPORTS SECTION -->
    <main id="content">
        <div class="container-fluid">

            <div class="row mb-4">
                <div class="col-12">
                    <h1 class="fs-3 mb-1 fw-bold">Financial Ledgers</h1>
                    <p class="text-muted mb-0">Review verified platform transactions, gross sales, and receipt
                        histories.</p>
                </div>
            </div>
            <!-- Financial gross header card -->
            <div class="row mb-4">
                <div class="col-md-4 col-12">
                    <div class="card p-4 bg-primary bg-opacity-10 rounded-2">
                        <div class="d-flex gap-3 align-items-center">
                            <div class="icon-shape bg-primary rounded-2 text-dark"><i class="ti ti-cash"></i></div>
                            <div>
                                <h2
                                    style="font-size:13px; color:hsl(var(--text-muted)); font-weight:600; margin-bottom:4px;">
                                    Gross Platform Revenue</h2>
                                <h3 id="report-revenue-summary" class="fw-bold mb-0">$0.00</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Transactions Spreadsheet Grid -->
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header"><i class="ti ti-receipt-2"></i> Verified Receipts Ledgers</div>
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th>Receipt ID</th>
                                        <th>Acquired Car</th>
                                        <th>Buyer Customer</th>
                                        <th>Price Charged</th>
                                        <th>Gateway Mode</th>
                                        <th>Acquisition Date</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-reports-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/admin.js"></script>
</body>

</html>
