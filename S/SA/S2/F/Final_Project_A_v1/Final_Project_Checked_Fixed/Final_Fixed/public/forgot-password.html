<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Recovery | Forgot Password</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Navigation bar placeholder -->
  <header id="main-nav"></header>
  <main class="auth-page">
    <div class="glass-card auth-card">
      <div class="auth-header">
        <h2>Reset <span class="gradient-text">Password</span></h2>
        <p>Enter your registered email address and we'll dispatch a mock recovery key.</p>
      </div>
      <form id="forgot-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="email@dealer.com" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:12px;"><i
            class="ti ti-mail-forward"></i> Send Recovery Link</button>
      </form>
      <div class="auth-footer">
        Remembered password? <a href="login.html">Sign In</a>
      </div>
    </div>
  </main>
  <!-- Client Footer -->
  <footer class="client-footer">
    <div class="container">
      <p style="font-size:12px; color:hsl(var(--text-muted));">
        Copyright &copy; 2026 Apex Motors. All Rights Reserved.
      </p>
    </div>
  </footer>
  <!-- Scripts -->
  <script src="js/app.js"></script>
</body>

</html>
