<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Portal | Visit Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>

<body>
    <!-- TOPBAR HEADER -->
    <nav id="topbar" class="navbar fixed-top px-3 d-flex justify-content-end align-items-center">
    </nav>
    <!-- SIDEBAR NAVIGATION MENU -->
    <aside id="sidebar" class="sidebar">
        <div class="logo-area">
            <div class="logo-text"><i class="ti ti-car"></i> APEX <span>PORTAL</span></div>
        </div>
        <div class="d-flex align-items-center gap-3 p-4 border-bottom border-secondary border-opacity-25">
            <div id="admin-avatar-text" class="seller-avatar bg-primary text-dark"
                style="width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700;">
                A</div>
            <div>
                <h4 id="admin-profile-name" class="mb-0 fs-6 fw-bold">Admin User</h4>
                <small id="admin-profile-role" class="text-muted text-uppercase" style="font-size:10px;">Role</small>
            </div>
        </div>
        <ul id="admin-sidebar-nav" class="nav flex-column gap-1 p-3"></ul>
    </aside>
    <!-- BOOKINGS SECTION -->
    <main id="content">
        <div class="container-fluid">

            <div class="row mb-4">
                <div class="col-12">
                    <h1 class="fs-3 mb-1 fw-bold">Visit Bookings</h1>
                    <p class="text-muted mb-0">Manage customer test drives and vehicle reserve listings scheduling.</p>
                </div>
            </div>
            <!-- Bookings Table -->
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th>Vehicle Model</th>
                                        <th>Customer Name</th>
                                        <th>Appt Date & Time</th>
                                        <th>Type</th>
                                        <th>Appt Status</th>
                                        <th>Customer Notes</th>
                                        <th>Appt Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-bookings-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/admin.js"></script>
</body>

</html>
