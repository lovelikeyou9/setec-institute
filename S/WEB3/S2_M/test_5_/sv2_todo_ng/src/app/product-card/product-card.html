<div class="card product-card position-relative" >
    <!-- {{ product | json }} -->
    <span class="badge-category">Stock: {{ product.qty }}</span>
    <div class="product-image shodow" style="width: 100%">
        <!--  -->

        <div style="border: 1px solid black; cursor: pointer;" [routerLink]="['/product-detail']"
            [queryParams]="{ product_id: product.id }">





            <img [src]="product.imageUrl" class="product-image img-fluid" alt="Basketball Sandals"
                onerror="this.src='./slider/No-Image-Placeholder.png';"
                style="height: 200px; width: 100%; object-fit: contain;">

            <div class="vertical-text product-title">
                <h5>{{ product.name }}</h5>
            </div>

        </div>

        <div class="vertical-text product-description">{{ product.description }}</div>



    </div>

    <span class="badge badge-danger product-discount">Stock: {{ product.qty }}</span>

    <div class="card-body">
        <div class="product-description">
            <h6>{{ product.name }}</h6>
        </div>
        <p class="mb-1">
            <span class="text-danger fw-bold">{{ product.price | currency }}</span>
            <span class="text-muted text-decoration-line-through">{{ ' - ' + (product.price | khmerCurrency:"in")
                }}</span>
        </p>

        <h6 class="card-title mb-2">{{ product.category }}</h6>
        <div class="color-options">
            <span class="color-yellow"></span>
            <span class="color-black"></span>
            <span class="color-gray"></span>
            <span class="color-dark"></span>
            <span class="color-plus">+</span>
            <input type="button" class="btn btn-outline-success btn-block mt-3" value="Add to Cart"
                (click)="onAddToCart(product)">
        </div>

    </div>
</div>
